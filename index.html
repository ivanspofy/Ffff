<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Хто Імпостер? — Brawl Stars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --yellow: #facc15;
      --orange: #f97316;
      --red:    #ef4444;
      --cyan:   #22d3ee;
      --purple: #a855f7;
      --bg1:    #1a0533;
      --bg2:    #0d1b4a;
      --bg3:    #0f2560;
    }

    html, body {
      min-height: 100%;
      font-family: 'Nunito', sans-serif;
      background: linear-gradient(145deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
      color: #fff;
      overflow-x: hidden;
    }
    /* global font override: replace Lilita One → Russo One */

    /* ── BG BLOBS ── */
    .blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(80px);
      z-index: 0;
    }
    .blob-tl { width: 320px; height: 320px; background: rgba(168,85,247,.18); top:-120px; left:-120px; }
    .blob-br { width: 380px; height: 380px; background: rgba(59,130,246,.18); bottom:-140px; right:-140px; }

    /* ── STARS ── */
    .stars { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: #fff;
      animation: twinkle var(--d, 3s) infinite ease-in-out var(--delay, 0s);
    }
    @keyframes twinkle { 0%,100%{opacity:.1} 50%{opacity:.6} }

    /* ── LAYOUT ── */
    #app {
      position: relative;
      z-index: 1;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
    }

    /* ── SCREENS ── */
    .screen { width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; gap: 28px; }
    .screen.hidden { display: none; }

    /* ── TITLE ── */
    .title-emoji { font-size: 64px; display: block; text-align: center; animation: wobble 3s ease-in-out infinite; }
    @keyframes wobble { 0%,100%{transform:rotate(0)} 30%{transform:rotate(-8deg)} 70%{transform:rotate(8deg)} }
    h1 {
      font-family: 'Russo One', sans-serif;
      font-size: 38px;
      color: var(--yellow);
      text-align: center;
      text-shadow: 0 2px 20px rgba(250,204,21,.6);
      letter-spacing: -1px;
    }
    .subtitle { color: #c4b5fd; font-size: 12px; font-weight: 800; letter-spacing: 4px; text-transform: uppercase; text-align: center; }

    /* ── SETTINGS CARD ── */
    .card {
      width: 100%;
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.4);
    }
    .card-section { margin-bottom: 20px; }
    .card-section:last-child { margin-bottom: 0; }
    .divider { height: 1px; background: rgba(255,255,255,.15); margin: 20px 0; }
    .section-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 16px; font-weight: 900; margin-bottom: 12px; color: #fff;
    }
    .section-label .icon { font-size: 18px; }
    .stepper { display: flex; align-items: center; gap: 12px; }
    .step-btn {
      width: 48px; height: 48px;
      border-radius: 14px;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.3);
      color: #fff;
      font-size: 26px; font-weight: 900;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: transform .1s, background .1s;
      flex-shrink: 0;
    }
    .step-btn:active { transform: scale(.88); background: rgba(255,255,255,.3); }
    .step-value { flex: 1; text-align: center; font-family: 'Russo One', sans-serif; font-size: 48px; text-shadow: 0 2px 12px rgba(0,0,0,.3); }
    .step-value.yellow { color: var(--yellow); }
    .step-value.red    { color: #f87171; }
    .step-hint { text-align: center; font-size: 11px; color: #c4b5fd; font-weight: 700; margin-top: 4px; }

    /* ── BUTTONS ── */
    .btn-start {
      width: 100%;
      height: 60px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(90deg, var(--yellow), var(--orange));
      color: #1a0533;
      font-family: 'Russo One', sans-serif;
      font-size: 20px;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 4px 30px rgba(250,204,21,.45);
      transition: transform .12s;
    }
    .btn-start:active { transform: scale(.96); }

    .btn-next {
      width: 100%;
      height: 56px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(90deg, #10b981, #0d9488);
      color: #fff;
      font-family: 'Russo One', sans-serif;
      font-size: 18px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(16,185,129,.4);
      transition: transform .12s;
      margin-top: 16px;
    }
    .btn-next:active { transform: scale(.96); }

    .btn-ghost {
      background: none;
      border: none;
      color: rgba(196,181,253,.55);
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      padding: 8px;
      margin-top: 8px;
    }
    .btn-ghost:active { opacity: .6; }

    .btn-restart {
      width: 100%;
      max-width: 300px;
      height: 60px;
      border-radius: 18px;
      border: none;
      background: linear-gradient(90deg, var(--yellow), var(--orange));
      color: #1a0533;
      font-family: 'Russo One', sans-serif;
      font-size: 20px;
      cursor: pointer;
      box-shadow: 0 4px 30px rgba(250,204,21,.4);
      transition: transform .12s;
    }
    .btn-restart:active { transform: scale(.96); }

    /* ── PROGRESS ── */
    .progress-wrap { width: 100%; margin-bottom: 24px; }
    .progress-labels { display: flex; justify-content: space-between; font-size: 11px; color: #c4b5fd; font-weight: 800; margin-bottom: 6px; }
    .progress-track { height: 8px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
    .progress-bar   { height: 100%; background: linear-gradient(90deg, var(--yellow), var(--orange)); border-radius: 99px; transition: width .4s ease; }

    /* ── PLAYER LABEL ── */
    .player-label { font-size: 12px; font-weight: 900; letter-spacing: 4px; text-transform: uppercase; color: rgba(255,255,255,.6); text-align: center; margin-bottom: 8px; }

    /* ── FLIP CARD ── */
    .flip-scene { width: 100%; perspective: 900px; }
    .flip-card  { width: 100%; position: relative; transform-style: preserve-3d; transition: transform .55s cubic-bezier(.16,1,.3,1); }
    .flip-card.flipped { transform: rotateY(180deg); }
    .flip-face {
      width: 100%;
      border-radius: 24px;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      min-height: 224px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 24px;
      text-align: center;
      cursor: pointer;
      box-shadow: 0 20px 50px rgba(0,0,0,.5);
    }
    .flip-front {
      background: linear-gradient(135deg, #3730a3, #581c87);
      border: 2px solid rgba(167,139,250,.4);
    }
    .flip-back-peace {
      position: absolute;
      top: 0; left: 0;
      background: linear-gradient(135deg, #2563eb, #4338ca, #6d28d9);
      border: 2px solid rgba(34,211,238,.5);
      transform: rotateY(180deg);
    }
    .flip-back-impostor {
      position: absolute;
      top: 0; left: 0;
      background: linear-gradient(135deg, #7f1d1d, #9f1239, #450a0a);
      border: 2px solid rgba(239,68,68,.5);
      transform: rotateY(180deg);
      overflow: hidden;
    }
    .flip-back-impostor::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(239,68,68,.08);
      animation: pulse-red 1.5s infinite;
    }
    @keyframes pulse-red { 0%,100%{opacity:0} 50%{opacity:1} }

    .face-emoji  { font-size: 60px; line-height: 1; }
    .face-name   { font-family: 'Russo One', sans-serif; font-size: 26px; color: #fff; }
    .face-hint   { font-size: 12px; color: rgba(196,181,253,.8); font-weight: 700; }
    .face-eye    { font-size: 48px; animation: blink 2s ease-in-out infinite; }
    @keyframes blink { 0%,90%,100%{transform:scaleY(1)} 95%{transform:scaleY(.1)} }

    .location-badge {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,.15);
      border-radius: 12px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 800;
      color: #cffafe;
    }
    .peace-badge {
      background: rgba(16,185,129,.25);
      border: 1px solid rgba(52,211,153,.4);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 900;
      color: #6ee7b7;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .impostor-title {
      font-family: 'Russo One', sans-serif;
      font-size: 32px;
      color: #fca5a5;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative; z-index: 1;
      animation: shake 1.2s ease-in-out infinite;
    }
    @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)} }
    .impostor-sub { font-size: 13px; color: rgba(252,165,165,.75); font-weight: 700; position: relative; z-index: 1; }
    .impostor-badge {
      background: rgba(239,68,68,.3);
      border: 1px solid rgba(248,113,113,.4);
      border-radius: 12px;
      padding: 4px 12px;
      font-size: 11px;
      font-weight: 900;
      color: #fca5a5;
      letter-spacing: 2px;
      text-transform: uppercase;
      position: relative; z-index: 1;
    }

    /* ── DONE SCREEN ── */
    .done-emoji { font-size: 90px; text-align: center; display: block; animation: spin-in .8s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes spin-in { from{transform:rotate(-180deg) scale(0); opacity:0} to{transform:rotate(0) scale(1); opacity:1} }
    .done-title { font-family: 'Russo One', sans-serif; font-size: 38px; color: var(--yellow); text-align: center; text-shadow: 0 2px 20px rgba(250,204,21,.5); }
    .done-sub   { color: #c4b5fd; font-size: 15px; font-weight: 700; text-align: center; margin-top: 8px; }

    /* ── PARTICLES ── */
    .particles { position: absolute; inset: 0; pointer-events: none; overflow: hidden; border-radius: 24px; }
    .particle {
      position: absolute;
      width: 8px; height: 8px;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      opacity: 0;
    }
    .particle.burst {
      animation: particle-fly var(--dur,.7s) ease-out var(--delay,0s) forwards;
    }
    @keyframes particle-fly {
      0%   { transform: translate(-50%,-50%) scale(0); opacity: 1; }
      60%  { opacity: 1; }
      100% { transform: translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,0px))) scale(0); opacity: 0; }
    }
  </style>
</head>
<body>

<!-- BG -->
<div class="blob blob-tl"></div>
<div class="blob blob-br"></div>
<div class="stars" id="stars"></div>

<div id="app">

  <!-- ══ SETTINGS SCREEN ══ -->
  <div class="screen" id="screen-settings">
    <div>
      <span class="title-emoji">🕵️</span>
      <h1>ХТО ІМПОСТЕР?</h1>
      <p class="subtitle">Brawl Stars Edition</p>
    </div>

    <div class="card">
      <div class="card-section">
        <div class="section-label"><span class="icon">👥</span> Кількість гравців</div>
        <div class="stepper">
          <button class="step-btn" id="players-minus">−</button>
          <div class="step-value yellow" id="players-val">5</div>
          <button class="step-btn" id="players-plus">+</button>
        </div>
        <p class="step-hint">від 3 до 20</p>
      </div>

      <div class="divider"></div>

      <div class="card-section">
        <div class="section-label"><span class="icon">💀</span> Кількість імпостерів</div>
        <div class="stepper">
          <button class="step-btn" id="impostors-minus">−</button>
          <div class="step-value red" id="impostors-val">1</div>
          <button class="step-btn" id="impostors-plus">+</button>
        </div>
        <p class="step-hint" id="impostors-hint">від 1 до 2</p>
      </div>
    </div>

    <button class="btn-start" id="btn-start">⚡ РОЗПОЧАТИ ГРУ</button>
  </div>

  <!-- ══ GAME SCREEN ══ -->
  <div class="screen hidden" id="screen-game">
    <div class="progress-wrap" style="width:100%;">
      <div class="progress-labels">
        <span>Прогрес</span>
        <span id="progress-text">1 / 5</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="progress-bar" style="width:20%"></div>
      </div>
    </div>

    <p class="player-label" id="player-label">Гравець 1</p>

    <div class="flip-scene" style="width:100%;">
      <div class="flip-card" id="flip-card">

        <!-- FRONT -->
        <div class="flip-face flip-front" id="flip-front">
          <div class="face-eye">👁️</div>
          <div class="face-name" id="front-name">Гравець 1, відкрий карту</div>
          <div class="face-hint">Натисни щоб побачити роль</div>
        </div>

        <!-- BACK (inserted dynamically) -->
        <div class="flip-face flip-back-peace" id="flip-back" style="display:none;">
          <div class="particles" id="particles"></div>
          <div class="face-emoji" id="back-emoji">🔫</div>
          <div class="face-name" id="back-name">Шеллі</div>
          <div class="location-badge" id="back-location">📍 Смарагдова печера</div>
          <div class="peace-badge" id="back-badge">✅ Мирний</div>
        </div>

      </div>
    </div>

    <button class="btn-next hidden" id="btn-next">➡️ Я запам'ятав — Далі</button>
    <button class="btn-ghost" id="btn-cancel">↩ Скасувати гру</button>
  </div>

  <!-- ══ DONE SCREEN ══ -->
  <div class="screen hidden" id="screen-done">
    <span class="done-emoji">🎮</span>
    <div>
      <div class="done-title">Всі готові!</div>
      <div class="done-sub">Обговоріть між собою та знайдіть імпостера!</div>
    </div>
    <button class="btn-restart" id="btn-restart">↩ Нова гра</button>
  </div>

</div>

<script>
// ── DATA ──────────────────────────────────────────────────────────────────────
const BRAWLERS = [
  { name:"Шеллі",     emoji:"🔫" },
  { name:"Кольт",     emoji:"🤠" },
  { name:"Ніта",      emoji:"🐻" },
  { name:"Булл",      emoji:"🐂" },
  { name:"Джессі",    emoji:"⚡" },
  { name:"Брок",      emoji:"🚀" },
  { name:"Динамайк",  emoji:"💣" },
  { name:"Бо",        emoji:"🏹" },
  { name:"Ель Прімо", emoji:"🥊" },
  { name:"Барлі",     emoji:"🍺" },
  { name:"Поко",      emoji:"🎸" },
  { name:"Роза",      emoji:"🌹" },
  { name:"Ріко",      emoji:"🎳" },
  { name:"Дерріл",    emoji:"🛢️" },
  { name:"Пенні",     emoji:"🏴‍☠️" },
  { name:"Карл",      emoji:"⛏️" },
  { name:"Пайпер",    emoji:"☂️" },
  { name:"Пам",       emoji:"🔧" },
  { name:"Френк",     emoji:"🔨" },
  { name:"Бібі",      emoji:"🏏" },
  { name:"Мортіс",    emoji:"⚰️" },
  { name:"Тара",      emoji:"🃏" },
  { name:"Джин",      emoji:"🧞" },
  { name:"Спайк",     emoji:"🌵" },
  { name:"Ворон",     emoji:"🐦‍⬛" },
  { name:"Леон",      emoji:"🐱" },
];
const LOCATIONS = [
  "Смарагдова печера","Арена Шоудаун","Шахта кристалів",
  "Магазин Барлі","Стародавнє місто","Острів піратів",
  "Кактусова пустеля","Зачарований ліс","Металевий завод",
  "Зірковий стадіон","Підводна база","Вулканічна фортеця",
  "Хмарний замок","Підземелля монстрів"
];

// ── HELPERS ───────────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length-1; i>0; i--) {
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function generateRoles(playerCount, impostorCount) {
  // ONE shared brawler and location for ALL peaceful players
  const sharedBrawler = BRAWLERS[Math.floor(Math.random() * BRAWLERS.length)];
  const sharedLocation = LOCATIONS[Math.floor(Math.random() * LOCATIONS.length)];
  // randomly pick which player indexes are impostors
  const impostorIdx = new Set(shuffle([...Array(playerCount).keys()]).slice(0, impostorCount));
  return Array.from({ length: playerCount }, (_, i) => ({
    brawler: impostorIdx.has(i) ? null : sharedBrawler,
    isImpostor: impostorIdx.has(i),
    location: sharedLocation,
  }));
}

// ── STARS ─────────────────────────────────────────────────────────────────────
const starsEl = document.getElementById('stars');
for (let i=0; i<28; i++) {
  const s = document.createElement('div');
  s.className = 'star';
  s.style.cssText = `top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--delay:${Math.random()*4}s;opacity:${.1+Math.random()*.4}`;
  starsEl.appendChild(s);
}

// ── STATE ─────────────────────────────────────────────────────────────────────
let players   = 5;
let impostors = 1;
let roles     = [];
let current   = 0;
let flipped   = false;

// ── SETTINGS LOGIC ────────────────────────────────────────────────────────────
function maxImpostors() { return Math.min(3, Math.floor(players/2)); }
function updateSettings() {
  document.getElementById('players-val').textContent   = players;
  impostors = Math.min(impostors, maxImpostors());
  document.getElementById('impostors-val').textContent = impostors;
  document.getElementById('impostors-hint').textContent = `від 1 до ${maxImpostors()}`;
}

document.getElementById('players-minus').addEventListener('click', () => { if(players>3) { players--; updateSettings(); }});
document.getElementById('players-plus').addEventListener('click',  () => { if(players<20){ players++; updateSettings(); }});
document.getElementById('impostors-minus').addEventListener('click',() => { if(impostors>1){ impostors--; updateSettings(); }});
document.getElementById('impostors-plus').addEventListener('click', () => { if(impostors<maxImpostors()){ impostors++; updateSettings(); }});

// ── SCREENS ───────────────────────────────────────────────────────────────────
function showScreen(name) {
  ['settings','game','done'].forEach(s => {
    const el = document.getElementById('screen-'+s);
    el.classList.toggle('hidden', s!==name);
  });
}

// ── PARTICLES ─────────────────────────────────────────────────────────────────
function burstParticles() {
  const container = document.getElementById('particles');
  container.innerHTML = '';
  const colors = ['#facc15','#f97316','#a855f7','#22d3ee','#f43f5e'];
  for (let i=0; i<20; i++) {
    const p = document.createElement('div');
    p.className = 'particle burst';
    const tx = (Math.random()-.5)*260;
    const ty = (Math.random()-.5)*260;
    p.style.cssText = `background:${colors[i%5]};--tx:${tx}px;--ty:${ty}px;--dur:${.6+Math.random()*.3}s;--delay:${i*.02}s`;
    container.appendChild(p);
  }
}

// ── RENDER CARD ───────────────────────────────────────────────────────────────
function renderCard(idx) {
  flipped = false;
  const card = document.getElementById('flip-card');
  card.classList.remove('flipped');

  document.getElementById('player-label').textContent = `Гравець ${idx+1}`;
  document.getElementById('front-name').textContent   = `Гравець ${idx+1}, відкрий карту`;

  const total = roles.length;
  document.getElementById('progress-text').textContent = `${idx+1} / ${total}`;
  document.getElementById('progress-bar').style.width  = `${((idx+1)/total)*100}%`;

  const role = roles[idx];
  const back = document.getElementById('flip-back');

  if (role.isImpostor) {
    back.className = 'flip-face flip-back-impostor';
    back.innerHTML = `
      <div class="particles" id="particles"></div>
      <div class="face-emoji" style="animation:shake 1.2s ease-in-out infinite">💀</div>
      <div class="impostor-title">Ти Імпостер!</div>
      <div class="impostor-sub">Не видай себе — обдури всіх!</div>
      <div class="impostor-badge">☠️ Імпостер</div>
    `;
  } else {
    back.className = 'flip-face flip-back-peace';
    back.innerHTML = `
      <div class="particles" id="particles"></div>
      <div class="face-emoji">${role.brawler.emoji}</div>
      <div class="face-name">${role.brawler.name}</div>
      <div class="location-badge">📍 ${role.location}</div>
      <div class="peace-badge">✅ Мирний</div>
    `;
  }
  back.style.display = 'flex';

  document.getElementById('btn-next').classList.add('hidden');
  document.getElementById('btn-next').textContent =
    (idx+1 === total) ? '🎮 Гра розпочата!' : '➡️ Я запам\'ятав — Далі';
}

// ── FLIP ──────────────────────────────────────────────────────────────────────
document.getElementById('flip-front').addEventListener('click', () => {
  if (flipped) return;
  flipped = true;
  document.getElementById('flip-card').classList.add('flipped');
  setTimeout(burstParticles, 280);
  document.getElementById('btn-next').classList.remove('hidden');
});

// ── NEXT PLAYER ───────────────────────────────────────────────────────────────
document.getElementById('btn-next').addEventListener('click', () => {
  current++;
  if (current >= roles.length) {
    showScreen('done');
  } else {
    renderCard(current);
  }
});

// ── START ─────────────────────────────────────────────────────────────────────
document.getElementById('btn-start').addEventListener('click', () => {
  roles   = generateRoles(players, impostors);
  current = 0;
  showScreen('game');
  renderCard(0);
});

// ── CANCEL / RESTART ──────────────────────────────────────────────────────────
document.getElementById('btn-cancel').addEventListener('click',  () => showScreen('settings'));
document.getElementById('btn-restart').addEventListener('click', () => showScreen('settings'));

// ── INIT ──────────────────────────────────────────────────────────────────────
updateSettings();
</script>
</body>
</html>
