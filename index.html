<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Хто Шпигун?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://cdn.brawlify.com" crossorigin/>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
  <meta name="theme-color" content="#0a0a1a"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

    :root {
      --accent:  #00e5ff;
      --accent2: #7c3aed;
      --gold:    #fbbf24;
      --red:     #ef4444;
      --green:   #10b981;
      --bg:      #080818;
      --bg2:     #0e0e28;
      --surface: rgba(255,255,255,.06);
      --border:  rgba(255,255,255,.10);
      --ftitle:  'Bebas Neue','Arial Black',Arial,sans-serif;
      --fbody:   'Nunito','Helvetica Neue',Arial,sans-serif;
    }

    html,body {
      height:100%; font-family:var(--fbody);
      background: var(--bg);
      color:#fff; overflow:hidden; -webkit-font-smoothing:antialiased;
    }

    /* ── ANIMATED BG GRID ── */
    #bg-canvas {
      position:fixed; inset:0; z-index:0;
      pointer-events:none;
    }

    /* ── SCANLINES overlay ── */
    body::after {
      content:'';
      position:fixed; inset:0; z-index:0; pointer-events:none;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,229,255,.015) 2px,
        rgba(0,229,255,.015) 4px
      );
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; transition-duration:.001ms !important; }
    }

    /* ── APP ── */
    #app {
      position:relative; z-index:1; height:100dvh;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:20px 18px; overflow:hidden;
    }

    .screen { width:100%; max-width:390px; display:flex; flex-direction:column; align-items:center; gap:16px; }
    .screen.hidden { display:none; }

    /* ══════════════════════════════
       SETTINGS SCREEN
    ══════════════════════════════ */
    .logo-wrap { text-align:center; }
    .logo-icon {
      font-size:64px; display:block; line-height:1;
      filter: drop-shadow(0 0 24px rgba(0,229,255,.6));
      animation: float 3s ease-in-out infinite;
    }
    @keyframes float {
      0%,100% { transform:translateY(0) rotate(-4deg); }
      50%      { transform:translateY(-8px) rotate(4deg); }
    }
    .logo-title {
      font-family:var(--ftitle); font-size:44px; letter-spacing:4px;
      background: linear-gradient(90deg, var(--accent), #a78bfa, var(--accent));
      background-size:200% auto;
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      animation: shimmer 3s linear infinite;
      line-height:1; margin-top:4px;
    }
    @keyframes shimmer { to { background-position:200% center; } }
    .logo-sub {
      font-size:10px; font-weight:800; letter-spacing:5px;
      text-transform:uppercase; color:rgba(0,229,255,.55);
      margin-top:6px;
    }

    /* MODE PICKER */
    .picker-wrap { display:flex; gap:10px; width:100%; }
    .picker-btn {
      flex:1; height:72px; border-radius:18px;
      border:1.5px solid var(--border);
      background:var(--surface);
      cursor:pointer; display:flex; flex-direction:column;
      align-items:center; justify-content:center; gap:4px;
      transition:transform .12s, border-color .2s, background .2s;
    }
    .picker-btn:active { transform:scale(.93); }
    .picker-btn.active    { border-color:var(--accent);  background:rgba(0,229,255,.08); }
    .picker-btn.active-cr { border-color:#a855f7; background:rgba(168,85,247,.1); }
    .picker-icon  { font-size:26px; line-height:1; }
    .picker-label { font-family:var(--ftitle); font-size:12px; letter-spacing:2px; color:#fff; }

    /* CARD */
    .card {
      width:100%;
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:22px;
      padding:20px;
      position:relative; overflow:hidden;
    }
    /* cyan top-edge glow */
    .card::before {
      content:''; position:absolute; top:0; left:10%; right:10%; height:1px;
      background:linear-gradient(90deg,transparent,var(--accent),transparent);
    }
    .divider { height:1px; background:var(--border); margin:16px 0; }
    .sec-label { font-size:13px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
                 color:rgba(255,255,255,.5); margin-bottom:12px; display:flex; align-items:center; gap:8px; }
    .sec-label span { font-size:16px; }

    .stepper { display:flex; align-items:center; gap:10px; }
    .step-btn {
      width:46px; height:46px; border-radius:12px; flex-shrink:0;
      background:rgba(255,255,255,.08); border:1px solid var(--border);
      color:#fff; font-size:26px; font-weight:900; cursor:pointer;
      display:flex; align-items:center; justify-content:center;
      transition:transform .1s, background .1s;
    }
    .step-btn:active { transform:scale(.84); background:rgba(0,229,255,.15); }
    .step-val { flex:1; text-align:center; font-family:var(--ftitle); font-size:56px; line-height:1; }
    .step-val.y { color:var(--gold); text-shadow:0 0 20px rgba(251,191,36,.4); }
    .step-val.r { color:#f87171; text-shadow:0 0 20px rgba(239,68,68,.4); }
    .step-hint { text-align:center; font-size:11px; color:rgba(255,255,255,.3); font-weight:700; margin-top:4px; }

    /* BUTTONS */
    .btn-cta {
      width:100%; height:56px; border-radius:16px; border:none; cursor:pointer;
      font-family:var(--ftitle); font-size:21px; letter-spacing:2px;
      position:relative; overflow:hidden;
      background:linear-gradient(90deg,#0891b2,var(--accent2));
      color:#fff;
      box-shadow:0 4px 28px rgba(0,229,255,.25), 0 0 0 1px rgba(0,229,255,.2);
      transition:transform .12s;
    }
    .btn-cta::before {
      content:''; position:absolute; inset:0;
      background:linear-gradient(90deg,transparent 0%,rgba(255,255,255,.12) 50%,transparent 100%);
      transform:translateX(-100%);
      animation:btn-shine 3s ease-in-out infinite;
    }
    @keyframes btn-shine { 60%,100%{transform:translateX(150%)} }
    .btn-cta:active { transform:scale(.96); }
    .btn-cta.purple {
      background:linear-gradient(90deg,#4c1d95,#7c3aed);
      box-shadow:0 4px 20px rgba(124,58,237,.3), 0 0 0 1px rgba(167,139,250,.2);
    }

    /* ══════════════════════════════
       GAME SCREEN
    ══════════════════════════════ */
    .progress-wrap { width:100%; }
    .progress-top  { display:flex; justify-content:space-between;
                     font-size:11px; font-weight:800; letter-spacing:2px;
                     text-transform:uppercase; color:rgba(255,255,255,.3); margin-bottom:6px; }
    .progress-track { height:4px; background:rgba(255,255,255,.08); border-radius:99px; overflow:hidden; }
    .progress-fill  { height:100%; border-radius:99px;
                      background:linear-gradient(90deg,var(--accent),#a78bfa);
                      box-shadow:0 0 8px rgba(0,229,255,.5);
                      transition:width .4s cubic-bezier(.16,1,.3,1); }

    .player-tag {
      font-family:var(--ftitle); font-size:14px; letter-spacing:5px;
      text-transform:uppercase; color:rgba(0,229,255,.6); text-align:center;
    }

    /* CARD WRAP */
    .card-wrap {
      width:100%; position:relative; border-radius:24px;
      touch-action:pan-x; user-select:none; -webkit-user-select:none;
      contain:layout paint;
    }

    /* ── ROLE CARD ── */
    .role-card {
      width:100%; min-height:236px; border-radius:24px;
      display:flex; flex-direction:column; align-items:center;
      justify-content:flex-end; text-align:center;
      position:relative; overflow:hidden;
    }
    .role-peace {
      background:linear-gradient(160deg,#030d30 0%,#0c1f6e 35%,#1e3a8a 65%,#1e1b4b 100%);
      border:1.5px solid rgba(0,229,255,.3);
      box-shadow:0 0 40px rgba(0,229,255,.08) inset;
    }
    .role-spy {
      background:linear-gradient(160deg,#0a0000 0%,#3b0e0e 40%,#7f1d1d 70%,#1a0000 100%);
      border:1.5px solid rgba(239,68,68,.4);
      animation:spy-pulse 1.8s ease-in-out infinite;
    }
    @keyframes spy-pulse {
      0%,100% { box-shadow:0 0 0 0 rgba(239,68,68,.0) inset; }
      50%      { box-shadow:0 0 40px 0 rgba(239,68,68,.2) inset; }
    }

    /* CHARACTER IMAGE */
    .char-wrap {
      flex:1; width:100%; display:flex; align-items:center; justify-content:center;
      padding-top:18px; position:relative; z-index:1; min-height:150px;
    }
    .char-ring-wrap { position:relative; width:124px; height:124px; }
    .char-ring {
      position:absolute; inset:-5px; border-radius:50%;
      background:conic-gradient(var(--accent) 0deg,#a78bfa 120deg,var(--accent) 240deg,#a78bfa 360deg);
      animation:spin-ring 5s linear infinite;
      will-change:transform;
    }
    .char-ring.spy {
      background:conic-gradient(#ef4444 0deg,#fca5a5 120deg,#dc2626 240deg,#fca5a5 360deg);
      animation:spin-ring 2.5s linear infinite;
    }
    @keyframes spin-ring { to { transform:rotate(360deg); } }
    .char-ring-bg {
      position:absolute; inset:4px; border-radius:50%;
      background:#0a0a1a; z-index:1;
    }
    .char-img-inner {
      position:absolute; inset:4px; border-radius:50%; overflow:hidden;
      z-index:2; display:flex; align-items:center; justify-content:center;
    }
    .char-img-inner img {
      width:120%; height:120%; object-fit:cover; object-position:center top;
      transform:scale(1.05) translateY(-3%); transition:opacity .3s;
    }
    .char-img-inner img.loading { opacity:0; }
    .char-img-inner img.loaded  { opacity:1; }
    .char-fallback { font-size:54px; line-height:1; }
    .char-glow {
      position:absolute; inset:-16px; border-radius:50%; z-index:0;
      background:radial-gradient(circle, rgba(0,229,255,.2) 0%, transparent 70%);
      animation:glow-beat 2s ease-in-out infinite;
    }
    .char-glow.spy {
      background:radial-gradient(circle, rgba(239,68,68,.2) 0%, transparent 70%);
      animation-duration:1.4s;
    }
    @keyframes glow-beat { 0%,100%{opacity:.5;transform:scale(1)} 50%{opacity:1;transform:scale(1.1)} }

    /* CARD BOTTOM */
    .card-btm {
      width:100%; padding:14px 18px 18px;
      background:linear-gradient(to top, rgba(0,0,0,.75) 0%, transparent 100%);
      display:flex; flex-direction:column; align-items:center; gap:7px;
      z-index:2; position:relative;
    }
    .role-char-name {
      font-family:var(--ftitle); font-size:28px; letter-spacing:1px; color:#fff;
      text-shadow:0 0 20px rgba(0,229,255,.4);
    }
    .role-loc {
      display:flex; align-items:center; gap:5px;
      background:rgba(0,0,0,.5); border:1px solid rgba(0,229,255,.2);
      border-radius:10px; padding:4px 12px;
      font-size:12px; font-weight:800; color:rgba(0,229,255,.85);
    }
    .role-status-badge {
      padding:3px 14px; border-radius:8px;
      font-size:10px; font-weight:900; letter-spacing:2px; text-transform:uppercase;
    }
    .badge-peace { background:rgba(16,185,129,.2); border:1px solid rgba(16,185,129,.4); color:#6ee7b7; }
    .spy-title {
      font-family:var(--ftitle); font-size:34px; letter-spacing:2px; color:#fca5a5;
      animation:shake 1s ease-in-out infinite;
      text-shadow:0 0 24px rgba(239,68,68,.7); position:relative; z-index:1;
    }
    @keyframes shake { 0%,100%{transform:rotate(0)} 25%{transform:rotate(-4deg)} 75%{transform:rotate(4deg)} }
    .spy-sub  { font-size:12px; color:rgba(252,165,165,.7); font-weight:700; position:relative; z-index:1; }
    .badge-spy { background:rgba(239,68,68,.25); border:1px solid rgba(248,113,113,.45); color:#fca5a5; position:relative; z-index:1; }

    /* ── COVER ── */
    .cover {
      position:absolute; inset:0; z-index:2; border-radius:24px;
      background:linear-gradient(160deg,#0e0e28 0%,#1a1040 50%,#0e0e28 100%);
      border:1.5px solid rgba(0,229,255,.2);
      box-shadow:0 0 0 1px rgba(0,229,255,.05), 0 20px 60px rgba(0,0,0,.6);
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; gap:10px; padding:28px;
      will-change:transform; cursor:grab; overflow:hidden;
    }
    /* cover corner decorations */
    .cover::before, .cover::after {
      content:''; position:absolute; width:60px; height:60px;
      border-color:rgba(0,229,255,.3); border-style:solid; border-width:0;
    }
    .cover::before { top:12px; left:12px; border-top-width:2px; border-left-width:2px; border-radius:8px 0 0 0; }
    .cover::after  { bottom:12px; right:12px; border-bottom-width:2px; border-right-width:2px; border-radius:0 0 8px 0; }

    .cover-icon {
      font-size:48px; line-height:1;
      animation:blink 3s ease-in-out infinite;
      filter:drop-shadow(0 0 16px rgba(0,229,255,.5));
    }
    @keyframes blink { 0%,88%,100%{transform:scaleY(1)} 92%{transform:scaleY(.06)} }
    .cover-title {
      font-family:var(--ftitle); font-size:20px; letter-spacing:1.5px; color:#fff; text-align:center;
    }
    .cover-hint { font-size:11px; color:rgba(0,229,255,.55); font-weight:800; letter-spacing:1px; }
    .cover-arrow {
      font-size:20px;
      animation:arrow-up .85s ease-in-out infinite;
      filter:drop-shadow(0 0 6px rgba(0,229,255,.6));
    }
    @keyframes arrow-up { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-7px)} }

    /* PARTICLES */
    .particles {
      position:absolute; inset:0; pointer-events:none;
      border-radius:24px; overflow:hidden; z-index:3; contain:strict;
    }
    .particle { position:absolute; border-radius:50%; top:50%; left:50%; will-change:transform,opacity; }
    .particle.pop { animation:pop var(--dur,.7s) ease-out var(--dl,0s) forwards; }
    @keyframes pop {
      0%   { transform:translate(-50%,-50%) scale(0); opacity:1; }
      60%  { opacity:1; }
      100% { transform:translate(calc(-50% + var(--tx,0px)), calc(-50% + var(--ty,0px))) scale(0); opacity:0; }
    }

    /* ACTION BUTTONS */
    .btn-action {
      width:100%; height:54px; border-radius:15px; border:none; cursor:pointer;
      font-family:var(--ftitle); font-size:20px; letter-spacing:1.5px; color:#fff;
      transition:transform .12s, opacity .25s;
      opacity:0; pointer-events:none;
    }
    .btn-action.on { opacity:1; pointer-events:auto; }
    .btn-action:active { transform:scale(.95); }
    .btn-next-act {
      background:linear-gradient(90deg,#047857,var(--green));
      box-shadow:0 4px 20px rgba(16,185,129,.3);
    }
    .btn-replay-act {
      background:rgba(255,255,255,.07);
      border:1px solid rgba(255,255,255,.14);
      font-size:16px; color:rgba(255,255,255,.6);
    }
    .btn-ghost {
      background:none; border:none; color:rgba(255,255,255,.2);
      font-size:12px; font-weight:800; cursor:pointer; padding:6px; letter-spacing:1px;
    }
    .btn-ghost:active { opacity:.5; }

    /* ══════════════════════════════
       DONE SCREEN
    ══════════════════════════════ */
    .done-icon { font-size:80px; display:block; text-align:center; animation:spin-in .9s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes spin-in { from{transform:rotate(-180deg) scale(0);opacity:0} to{transform:rotate(0) scale(1);opacity:1} }
    .done-title {
      font-family:var(--ftitle); font-size:38px; letter-spacing:3px; text-align:center;
      background:linear-gradient(90deg,var(--accent),#a78bfa);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .done-sub { color:rgba(255,255,255,.45); font-size:14px; font-weight:700; text-align:center; }

    /* ══════════════════════════════
       RESULTS SCREEN
    ══════════════════════════════ */
    .results-hdr { text-align:center; }
    .results-title {
      font-family:var(--ftitle); font-size:34px; letter-spacing:3px;
      background:linear-gradient(90deg,var(--accent),#a78bfa);
      -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
    }
    .results-sub { font-size:10px; color:rgba(255,255,255,.3); font-weight:800;
                   letter-spacing:4px; text-transform:uppercase; margin-top:3px; }

    .results-scroll {
      width:100%; max-height:48vh; overflow-y:auto;
      display:flex; flex-direction:column; gap:7px; padding-right:2px;
    }
    .results-scroll::-webkit-scrollbar { width:2px; }
    .results-scroll::-webkit-scrollbar-thumb { background:rgba(0,229,255,.3); border-radius:99px; }

    .result-row {
      display:flex; align-items:center; gap:11px;
      background:var(--surface); border-radius:14px;
      padding:9px 13px; border:1px solid var(--border);
      animation:slide-in .3s cubic-bezier(.16,1,.3,1) both;
      animation-delay:var(--rd,0s);
    }
    @keyframes slide-in { from{transform:translateX(-16px);opacity:0} to{transform:translateX(0);opacity:1} }
    .result-row.is-spy { background:rgba(239,68,68,.1); border-color:rgba(239,68,68,.25); }
    .result-num { font-family:var(--ftitle); font-size:20px; color:rgba(255,255,255,.25); min-width:24px; }
    .result-thumb {
      width:42px; height:42px; border-radius:50%; overflow:hidden; flex-shrink:0;
      border:1.5px solid var(--border); background:rgba(255,255,255,.06);
      display:flex; align-items:center; justify-content:center; font-size:20px;
    }
    .result-thumb.spy-thumb { border-color:rgba(239,68,68,.4); background:rgba(239,68,68,.1); }
    .result-thumb img { width:130%; height:130%; object-fit:cover; object-position:center top; transform:translateY(-5%); }
    .result-info { flex:1; }
    .result-name { font-weight:900; font-size:14px; color:#fff; }
    .result-loc  { font-size:11px; color:rgba(0,229,255,.55); font-weight:700; margin-top:1px; }
    .result-pill { padding:3px 9px; border-radius:7px; font-size:10px; font-weight:900;
                   letter-spacing:1.5px; text-transform:uppercase; white-space:nowrap; }
    .pill-p { background:rgba(16,185,129,.2); color:#6ee7b7; border:1px solid rgba(16,185,129,.3); }
    .pill-s { background:rgba(239,68,68,.25); color:#fca5a5; border:1px solid rgba(239,68,68,.3); }

    .results-info-card {
      width:100%; background:var(--surface); border-radius:16px;
      border:1px solid var(--border); padding:13px 16px;
      display:flex; align-items:center; gap:13px;
    }
    .ric-thumb {
      width:52px; height:52px; border-radius:50%; overflow:hidden; flex-shrink:0;
      border:1.5px solid rgba(0,229,255,.4); background:rgba(255,255,255,.06);
      display:flex; align-items:center; justify-content:center; font-size:26px;
    }
    .ric-thumb img { width:130%; height:130%; object-fit:cover; object-position:center top; transform:translateY(-5%); }
    .ric-text  { font-size:12px; color:rgba(255,255,255,.45); font-weight:700; line-height:1.5; }
    .ric-name  { font-family:var(--ftitle); font-size:19px; color:#fff; letter-spacing:1px; }
    .ric-loc   { color:var(--accent); font-weight:800; }

    .btn-row  { display:flex; gap:10px; width:100%; }
    .btn-half { flex:1; height:50px; border-radius:14px; border:none; cursor:pointer;
                font-family:var(--ftitle); font-size:17px; letter-spacing:1.5px; transition:transform .12s; }
    .btn-half:active { transform:scale(.94); }
    .btn-half.p { background:linear-gradient(90deg,#0891b2,var(--accent2)); color:#fff; box-shadow:0 4px 16px rgba(0,229,255,.2); }
    .btn-half.s { background:var(--surface); color:rgba(255,255,255,.7); border:1px solid var(--border); }
  </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div id="app">

  <!-- ═══ SETTINGS ═══ -->
  <div class="screen" id="screen-settings">
    <div class="logo-wrap">
      <span class="logo-icon">🕵️</span>
      <div class="logo-title">ХТО ШПИГУН?</div>
      <div class="logo-sub" id="mode-subtitle">Brawl Stars Edition</div>
    </div>

    <div class="picker-wrap">
      <button class="picker-btn active" id="pick-bs" onclick="selectMode('bs')">
        <span class="picker-icon">⭐</span>
        <span class="picker-label">BRAWL STARS</span>
      </button>
      <button class="picker-btn" id="pick-cr" onclick="selectMode('cr')">
        <span class="picker-icon">👑</span>
        <span class="picker-label">CLASH ROYALE</span>
      </button>
    </div>

    <div class="card">
      <div class="sec-label"><span>👥</span> Кількість гравців</div>
      <div class="stepper">
        <button class="step-btn" id="pl-minus">−</button>
        <div class="step-val y" id="pl-val">5</div>
        <button class="step-btn" id="pl-plus">+</button>
      </div>
      <p class="step-hint">від 3 до 20</p>
      <div class="divider"></div>
      <div class="sec-label"><span>🔴</span> Кількість шпигунів</div>
      <div class="stepper">
        <button class="step-btn" id="im-minus">−</button>

// ══════════════════════════════════════════════════════════
// ANIMATED BACKGROUND — dot grid + radar sweep
// ══════════════════════════════════════════════════════════
(function(){
  const c  = document.getElementById('bg-canvas');
  const cx = c.getContext('2d');
  let W, H;

  function resize(){ W=c.width=innerWidth; H=c.height=innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const COLS = '#00e5ff', DOT_R = 1, SPACING = 44;
  let angle = 0;

  // Pre-build dot positions once
  let dots = [];
  function buildDots(){
    dots = [];
    for(let x=SPACING/2; x<W; x+=SPACING)
      for(let y=SPACING/2; y<H; y+=SPACING)
        dots.push([x,y]);
  }
  buildDots();
  window.addEventListener('resize', buildDots);

  function draw(ts){
    cx.clearRect(0,0,W,H);

    // Dots
    cx.fillStyle = 'rgba(0,229,255,.12)';
    dots.forEach(([x,y])=>{ cx.beginPath(); cx.arc(x,y,DOT_R,0,Math.PI*2); cx.fill(); });

    // Radar sweep from center
    const cx2 = W/2, cy2 = H*.45;
    const R   = Math.max(W,H)*.7;
    angle = (ts/8000) * Math.PI * 2;   // full rotation every 8s

    const grd = cx.createConicalGradient
      ? cx.createConicalGradient(angle, cx2, cy2)   // non-standard, may not exist
      : null;

    // Fallback: simple sector
    cx.save();
    cx.translate(cx2, cy2);
    cx.rotate(angle);
    const g = cx.createLinearGradient(0,0,R,0);
    g.addColorStop(0,'rgba(0,229,255,.0)');
    g.addColorStop(.7,'rgba(0,229,255,.04)');
    g.addColorStop(1,'rgba(0,229,255,.12)');
    cx.beginPath();
    cx.moveTo(0,0);
    cx.arc(0,0,R,-Math.PI*.18,Math.PI*.18);
    cx.closePath();
    cx.fillStyle = g;
    cx.fill();
    cx.restore();

    // Subtle concentric circles
    for(let r=80;r<Math.max(W,H)*1.1;r+=120){
      cx.beginPath();
      cx.arc(cx2,cy2,r,0,Math.PI*2);
      cx.strokeStyle='rgba(0,229,255,.04)';
      cx.lineWidth=1;
      cx.stroke();
    }

    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);
})();

let audioCtx = null;
function getCtx(){ if(!audioCtx) audioCtx=new(window.AudioContext||window.webkitAudioContext)(); return audioCtx; }
function playTone(freq,type,duration,volume=0.18,delay=0){
  try{
    const ctx=getCtx(),osc=ctx.createOscillator(),gain=ctx.createGain();
    osc.connect(gain);gain.connect(ctx.destination);
    osc.type=type;osc.frequency.setValueAtTime(freq,ctx.currentTime+delay);
    gain.gain.setValueAtTime(0,ctx.currentTime+delay);
    gain.gain.linearRampToValueAtTime(volume,ctx.currentTime+delay+0.01);
    gain.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+delay+duration);
    osc.start(ctx.currentTime+delay);osc.stop(ctx.currentTime+delay+duration+0.05);
  }catch(e){}
}
const SFX = {
  click()  { playTone(900,'square',.05,.1); },
  start()  { [261,329,392,523].forEach((f,i)=>playTone(f,'sine',.22,.14,i*.07)); },
  reveal() { playTone(400,'sine',.08,.1);playTone(700,'sine',.14,.11,.06);playTone(1000,'sine',.08,.08,.12); },
  peace()  { [523,659,784].forEach((f,i)=>playTone(f,'sine',.28,.12,i*.08)); },
  next()   { playTone(500,'sine',.1,.12);playTone(620,'sine',.1,.1,.08); },
  done()   { [523,659,784,1047].forEach((f,i)=>playTone(f,'sine',.3,.16,i*.1)); },
  pop()    { for(let i=0;i<5;i++) playTone(400+Math.random()*400,'sine',.08,.06,i*.04); },
};

// ══════════════════════════════════════════════════════════
// UTILS
// ══════════════════════════════════════════════════════════
function shuffle(arr){
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}
function pick(arr){ return arr[Math.floor(Math.random()*arr.length)]; }

// ══════════════════════════════════════════════════════════
// GENERATE ROLES
// ══════════════════════════════════════════════════════════
function generateRoles(playerCount, impostorCount){
  const chars   = gameMode==='cr' ? CR_CHARS : BRAWLERS;
  const locs    = gameMode==='cr' ? CR_LOCATIONS : BS_LOCATIONS;
  const brawler = pick(chars);
  const location= pick(locs);
  const impSet  = new Set(shuffle(Array.from({length:playerCount},(_,i)=>i)).slice(0,impostorCount));
  return Array.from({length:playerCount},(_,i)=>({brawler,location,isImpostor:impSet.has(i)}));
}

// ══════════════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════════════
let players=5, impostors=1, roles=[], current=0, revealed=false;

function maxImp(){ return Math.min(3,Math.floor(players/2)); }
function syncSettings(){
  document.getElementById('pl-val').textContent=players;
  impostors=Math.min(impostors,maxImp());
  document.getElementById('im-val').textContent=impostors;
  document.getElementById('im-hint').textContent=`від 1 до ${maxImp()}`;
}
document.getElementById('pl-minus').onclick=()=>{if(players>3){players--;syncSettings();SFX.click();}};
document.getElementById('pl-plus') .onclick=()=>{if(players<20){players++;syncSettings();SFX.click();}};
document.getElementById('im-minus').onclick=()=>{if(impostors>1){impostors--;syncSettings();SFX.click();}};
document.getElementById('im-plus') .onclick=()=>{if(impostors<maxImp()){impostors++;syncSettings();SFX.click();}};

function showScreen(n){
  ['settings','game','done','results'].forEach(s=>
    document.getElementById('screen-'+s).classList.toggle('hidden',s!==n));
}

// ══════════════════════════════════════════════════════════
// PARTICLES
// ══════════════════════════════════════════════════════════
const P_COLORS = ['#00e5ff','#a78bfa','#fbbf24','#f97316','#f43f5e','#4ade80'];
function popParticles(){
  const c=document.getElementById('particles'); c.innerHTML='';
  const frag=document.createDocumentFragment();
  for(let i=0;i<22;i++){
    const p=document.createElement('div'); p.className='particle pop';
    const sz = 5+Math.random()*7;
    const tx=(Math.random()-.5)*300, ty=(Math.random()-.5)*300;
    p.style.cssText=`width:${sz}px;height:${sz}px;background:${P_COLORS[i%P_COLORS.length]};--tx:${tx}px;--ty:${ty}px;--dur:${.5+Math.random()*.45}s;--dl:${i*.016}s`;
    frag.appendChild(p);
  }
  c.appendChild(frag); SFX.pop();
}

// ══════════════════════════════════════════════════════════
// IMAGE CACHE
// ══════════════════════════════════════════════════════════
const imgCache = new Map();
function prefetchImage(url){
  if(!url||imgCache.has(url)) return Promise.resolve();
  return new Promise(res=>{
    const img=new Image(); img.decoding='async';
    img.onload=img.onerror=()=>{imgCache.set(url,img);res();};
    img.src=url;
  });
}

// ══════════════════════════════════════════════════════════
// RENDER ROLE CARD
// ══════════════════════════════════════════════════════════
function makeCharHTML(char, isSpy){
  const cached=imgCache.has(char.img);
  const ringClass = isSpy ? 'char-ring spy' : 'char-ring';
  const glowClass = isSpy ? 'char-glow spy' : 'char-glow';
  return `
    <div class="char-ring-wrap">
      <div class="${ringClass}"></div>
      <div class="char-ring-bg"></div>
      <div class="char-img-inner">
        <img src="${char.img}" alt="${char.name}" decoding="async" loading="eager" fetchpriority="high"
          class="${cached?'loaded':'loading'}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
          onload="this.classList.remove('loading');this.classList.add('loaded');"/>
        <div class="char-fallback" style="display:none">${char.emoji}</div>
      </div>
      <div class="${glowClass}"></div>
    </div>`;
}

function renderRoleCard(idx){
  const {brawler,location,isImpostor}=roles[idx];
  const rc=document.getElementById('role-card');
  if(isImpostor){
    rc.className='role-card role-spy';
    rc.innerHTML=`
      <div class="char-wrap">
        <div class="char-ring-wrap">

            <span style="font-size:58px;line-height:1;animation:shake 1s ease-in-out infinite">💀</span>
          </div>
          <div class="char-glow spy"></div>
        </div>
      </div>
      <div class="card-btm">
        <div class="spy-title">Ти Шпигун!</div>
        <div class="spy-sub">Не видай себе — обдури всіх!</div>
        <div class="role-status-badge badge-spy">🔴 ШПИГУН</div>

}

// ══════════════════════════════════════════════════════════
// PHYSICS — critically-damped spring
// ══════════════════════════════════════════════════════════
const PHYS = {
  stiffness:320, damping:36,
  stiffnessReveal:260, dampingReveal:26,
  threshold:55, flickVel:-400,
};
let physRAF=null;
function cancelPhysics(){ if(physRAF){cancelAnimationFrame(physRAF);physRAF=null;} }

function springTo(startY,startVy,target,k,d,onDone){
  cancelPhysics();
  const cover=document.getElementById('cover');
  cover.style.transition='none';
  let y=startY, vy=startVy, t=performance.now();
  const SUB=4;
  function step(now){
    const rawDt=Math.min((now-t)/1000,.032); t=now;
    const dt=rawDt/SUB;
    for(let i=0;i<SUB;i++){
      vy+=(-k*(y-target)-d*vy)*dt;
      y +=vy*dt;
    }
    if(startY<=0&&y>0){y=0;vy=0;}
    cover.style.transform=`translate3d(0,${y}px,0)`;
    if(Math.abs(y-target)<0.3&&Math.abs(vy)<1.5){
      cover.style.transform=`translate3d(0,${target}px,0)`;
      physRAF=null; onDone&&onDone(); return;
    }
    physRAF=requestAnimationFrame(step);
  }
  physRAF=requestAnimationFrame(step);
}

// ══════════════════════════════════════════════════════════
// SWIPE
// ══════════════════════════════════════════════════════════
(function(){
  const wrap=document.getElementById('card-wrap');
  const cover=document.getElementById('cover');
  let drag=false,sy=0,sx=0,curDy=0,maxUpDy=0,coverH=240;
  const VB=6, vBuf=Array.from({length:VB},()=>({y:0,t:0}));
  let vIdx=0;
  function resetVel(y,t){for(let i=0;i<VB;i++)vBuf[i]={y,t};vIdx=0;}
  function pushVel(y,t){vBuf[vIdx++%VB]={y,t};}
  function getVy(){
    const n=vBuf[(vIdx-1+VB)%VB],o=vBuf[vIdx%VB];
    const dt=n.t-o.t; return dt<2?0:(n.y-o.y)/dt*1000;
  }
  function start(y,x){
    if(revealed)return; cancelPhysics();
    sy=y;sx=x;drag=true;curDy=0;maxUpDy=0;
    coverH=cover.offsetHeight||240;
    resetVel(y,performance.now()); cover.style.transition='none';
  }
  function move(y,x){
    if(!drag||revealed)return;
    const dy=y-sy,dx=x-sx;
    if(Math.abs(dx)>Math.abs(dy)+12){drag=false;return;}
    curDy=dy<0?dy:dy*.35;
    if(dy<maxUpDy)maxUpDy=dy;
    cover.style.transform=`translate3d(0,${curDy}px,0)`;
    pushVel(y,performance.now());
  }
  function doReveal(snapY,snapVy){
    if(revealed)return;
    revealed=true; SFX.reveal(); popParticles(); SFX.peace();
    springTo(snapY,snapVy,0,PHYS.stiffnessReveal,PHYS.dampingReveal,()=>{
      document.getElementById('btn-next').classList.add('on');
      document.getElementById('btn-replay').classList.add('on');
    });
  }
  function end(){
    if(!drag)return; drag=false;
    const vy=getVy();
    const wentUp=maxUpDy<=-PHYS.threshold, fastFlick=vy<PHYS.flickVel;
    if(wentUp||fastFlick){ doReveal(curDy,vy); }
    else { springTo(curDy,vy,0,PHYS.stiffness,PHYS.damping,null); }
    curDy=0;
  }
  wrap.addEventListener('touchstart', e=>{const t=e.touches[0];start(t.clientY,t.clientX);},{passive:true});
  wrap.addEventListener('touchmove',  e=>{const t=e.touches[0];move(t.clientY,t.clientX); },{passive:true});
  wrap.addEventListener('touchend',   end,{passive:true});
  wrap.addEventListener('touchcancel',end,{passive:true});
  let md=false;
  wrap.addEventListener('mousedown',  e=>{md=true;start(e.clientY,e.clientX);});
  window.addEventListener('mousemove',e=>{if(md)move(e.clientY,e.clientX);});
  window.addEventListener('mouseup',  ()=>{if(md){md=false;end();}});
})();

// ══════════════════════════════════════════════════════════
// RENDER CARD (reset state)
// ══════════════════════════════════════════════════════════
function renderCard(idx){
  revealed=false; cancelPhysics();
  const total=roles.length;
  document.getElementById('prog-txt').textContent=`${idx+1} / ${total}`;
  document.getElementById('prog-bar').style.width=`${((idx+1)/total)*100}%`;
  document.getElementById('player-tag').textContent=`ГРАВЕЦЬ ${idx+1}`;
  document.getElementById('cover-title').textContent=`Гравець ${idx+1}, свайп вгору`;
  document.getElementById('btn-next').textContent=
    (idx+1===total)?'🎮 ГРА РОЗПОЧАТА!':"➡ Я ЗАПАМ'ЯТАВ — ДАЛІ";
  const cover=document.getElementById('cover');
  cover.style.transition='none'; cover.style.transform='translate3d(0,0,0)';
  document.getElementById('btn-next').classList.remove('on');
  document.getElementById('btn-replay').classList.remove('on');
  renderRoleCard(idx);
  // prefetch next
  if(idx+1<roles.length) prefetchImage(roles[idx+1].brawler.img);
}

// ══════════════════════════════════════════════════════════
// RESULTS
// ══════════════════════════════════════════════════════════
function makeThumbHTML(char,isSpy){
  if(isSpy) return `<div class="result-thumb spy-thumb">💀</div>`;
  return `<div class="result-thumb">
    <img src="${char.img}" alt="${char.name}"
         onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
         onload="this.style.opacity='1';" style="opacity:0;transition:opacity .3s">
    <span style="display:none;font-size:20px">${char.emoji}</span>
  </div>`;
}
function showResults(){
  const {brawler,location}=roles[0];
  const charLabel=gameMode==='cr'?'Персонаж':'Бравлер';
  const spyNums=roles.map((r,i)=>r.isImpostor?`Гравець ${i+1}`:null).filter(Boolean);
  document.getElementById('results-info-card').innerHTML=`
    <div class="ric-thumb">
      <img src="${brawler.img}" alt="${brawler.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
           onload="this.style.opacity='1';" style="opacity:0;transition:opacity .3s">
      <span style="display:none;font-size:26px">${brawler.emoji}</span>
    </div>
    <div class="ric-text">
      <div style="font-size:10px;color:rgba(0,229,255,.5);font-weight:800;letter-spacing:2px;text-transform:uppercase">${charLabel}</div>
      <div class="ric-name">${brawler.name}</div>
      <div class="ric-loc">📍 ${location}</div>
      <div style="margin-top:4px;font-size:11px;color:#6ee7b7">
        Шпигун${spyNums.length>1?'и':''}: <strong>${spyNums.join(', ')}</strong>
      </div>
    </div>`;
  const list=document.getElementById('results-list'); list.innerHTML='';
  roles.forEach((r,i)=>{
    const row=document.createElement('div');
    row.className='result-row'+(r.isImpostor?' is-spy':'');
    row.style.setProperty('--rd',`${i*.06}s`);
    row.innerHTML=`
      <div class="result-num">${i+1}</div>
      ${makeThumbHTML(r.brawler,r.isImpostor)}
      <div class="result-info">
        <div class="result-name">${r.isImpostor?'ШПИГУН':r.brawler.name}</div>
        <div class="result-loc">${r.isImpostor?'Не знав локацію':'📍 '+r.location}</div>
      </div>
      <div class="result-pill ${r.isImpostor?'pill-s':'pill-p'}">
        ${r.isImpostor?'🔴 ШПИ':'✅ МИР'}
      </div>`;
    list.appendChild(row);
  });
  showScreen('results');
}

// ══════════════════════════════════════════════════════════
// BUTTONS
// ══════════════════════════════════════════════════════════
document.getElementById('btn-next').onclick=()=>{
  SFX.next(); current++;
  if(current>=roles.length){SFX.done();showScreen('done');}
  else renderCard(current);
};
document.getElementById('btn-start').onclick=()=>{
  SFX.start();
  roles=generateRoles(players,impostors); current=0;
  prefetchImage(roles[0].brawler.img);
  showScreen('game'); renderCard(0);
};
document.getElementById('btn-cancel').onclick=()=>{SFX.click();showScreen('settings');};
document.getElementById('btn-replay').onclick=()=>{
  SFX.click();
  document.getElementById('btn-next').classList.remove('on');
  document.getElementById('btn-replay').classList.remove('on');
  revealed=false; cancelPhysics();
  const cover=document.getElementById('cover');
  cover.style.transition='transform .4s cubic-bezier(.34,1.4,.64,1)';
  cover.style.transform='translate3d(0,0,0)';
};
document.getElementById('btn-restart').onclick=()=>{SFX.click();showScreen('settings');};
document.getElementById('btn-show-results').onclick=()=>{SFX.click();showResults();};
document.getElementById('btn-results-new').onclick=()=>{SFX.click();showScreen('settings');};
document.getElementById('btn-results-same').onclick=()=>{
  SFX.start();
  roles=generateRoles(players,impostors); current=0;
  prefetchImage(roles[0].brawler.img);
  showScreen('game'); renderCard(0);
};

syncSettings();
</script>
