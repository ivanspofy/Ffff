<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Хто Імпостер?</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link rel="preconnect" href="https://cdn.brawlify.com" crossorigin/>
  <link rel="preconnect" href="https://royaleapi.github.io" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
  <meta name="theme-color" content="#1a0533"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

    :root {
      --yellow:#facc15; --orange:#f97316; --red:#ef4444;
      --cyan:#22d3ee;   --bg1:#1a0533;   --bg2:#0d1b4a; --bg3:#0f2560;
      --green:#10b981;
      --ftitle:'Bebas Neue','Arial Black',Arial,sans-serif;
      --fbody:'Nunito','Helvetica Neue',Arial,sans-serif;
    }

    html,body {
      height:100%; font-family:var(--fbody);
      /* Замість двох розмитих блобів — один статичний radial-gradient. Нуль filter:blur(). */
      background:
        radial-gradient(420px 420px at 0% 0%, rgba(168,85,247,.22), transparent 60%),
        radial-gradient(480px 480px at 100% 100%, rgba(59,130,246,.22), transparent 60%),
        linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
      background-attachment: fixed;
      color:#fff; overflow:hidden; -webkit-font-smoothing:antialiased;
    }

    .stars { position:fixed;inset:0;pointer-events:none;z-index:0;
             transform:translateZ(0); will-change:opacity; contain:strict; }
    .star  { position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
             animation:twinkle var(--d,3s) infinite ease-in-out var(--dl,0s); }
    @keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.55}}

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
    }

    #app {
      position:relative;z-index:1;height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:20px 16px;overflow:hidden;
    }

    .screen{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:18px;}
    .screen.hidden{display:none;}

    /* ── GAME PICKER ── */
    .picker-wrap{display:flex;gap:12px;width:100%;}
    .picker-btn{flex:1;height:80px;border-radius:20px;border:2px solid rgba(255,255,255,.15);
                background:rgba(255,255,255,.08);cursor:pointer;
                display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
                transition:transform .12s,border-color .15s,background .15s;-webkit-tap-highlight-color:transparent;}
    .picker-btn:active{transform:scale(.94);}
    .picker-btn.active{border-color:var(--yellow);background:rgba(250,204,21,.12);}
    .picker-btn.active-cr{border-color:#a855f7;background:rgba(168,85,247,.14);}
    .picker-icon{font-size:30px;line-height:1;}
    .picker-label{font-family:var(--ftitle);font-size:13px;letter-spacing:1.5px;color:#fff;}

    /* ── SETTINGS ── */
    .title-emoji{font-size:58px;display:block;text-align:center;animation:wobble 3s ease-in-out infinite;}
    @keyframes wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
    h1{font-family:var(--ftitle);font-size:40px;letter-spacing:3px;color:var(--yellow);
       text-align:center;text-shadow:0 2px 24px rgba(250,204,21,.55);line-height:1;}
    .subtitle{color:#c4b5fd;font-size:11px;font-weight:800;letter-spacing:5px;
              text-transform:uppercase;text-align:center;}
    .card{width:100%;background:rgba(36,18,80,.55);
          border:1px solid rgba(255,255,255,.2);border-radius:24px;
          padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
    .divider{height:1px;background:rgba(255,255,255,.15);margin:16px 0;}
    .sec-label{display:flex;align-items:center;gap:8px;
               font-size:15px;font-weight:900;margin-bottom:12px;}
    .stepper{display:flex;align-items:center;gap:10px;}
    .step-btn{width:48px;height:48px;border-radius:14px;flex-shrink:0;
              background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);
              color:#fff;font-size:28px;font-weight:900;cursor:pointer;
              display:flex;align-items:center;justify-content:center;
              transition:transform .1s,background .1s;}
    .step-btn:active{transform:scale(.85);background:rgba(255,255,255,.3);}
    .step-val{flex:1;text-align:center;font-family:var(--ftitle);font-size:52px;line-height:1;}
    .step-val.y{color:var(--yellow);}
    .step-val.r{color:#f87171;}
    .step-hint{text-align:center;font-size:11px;color:#a78bfa;font-weight:700;margin-top:4px;}
    .btn-primary{width:100%;height:58px;border-radius:18px;border:none;cursor:pointer;
                 background:linear-gradient(90deg,var(--yellow),var(--orange));
                 color:#1a0533;font-family:var(--ftitle);font-size:22px;letter-spacing:2px;
                 box-shadow:0 4px 28px rgba(250,204,21,.45);transition:transform .12s;}
    .btn-primary:active{transform:scale(.96);}

    /* ── GAME ── */
    .progress-wrap{width:100%;}
    .progress-top{display:flex;justify-content:space-between;
                  font-size:11px;color:#a78bfa;font-weight:800;margin-bottom:5px;}
    .progress-track{height:7px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
    .progress-bar{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));
                  border-radius:99px;transition:width .4s ease;}
    .player-tag{font-family:var(--ftitle);font-size:20px;letter-spacing:3px;
                color:rgba(255,255,255,.55);text-align:center;}

    .card-wrap{width:100%;position:relative;border-radius:28px;overflow:hidden;
               touch-action:pan-x;user-select:none;-webkit-user-select:none;
               contain:layout paint;}

    /* ══════════════════════════════════════════
       ROLE CARD — з картинкою персонажа
    ══════════════════════════════════════════ */
    .role-card{
      width:100%;min-height:240px;border-radius:28px;
      display:flex;flex-direction:column;align-items:center;
      justify-content:flex-end;gap:0;padding:0;text-align:center;
      position:relative;overflow:hidden;
    }
    /* фон карти */
    .role-peace{
      background:linear-gradient(160deg,#0f2a80 0%,#1d4ed8 40%,#4338ca 70%,#6d28d9 100%);
      border:2px solid rgba(34,211,238,.45);
    }
    .role-impostor{
      background:linear-gradient(160deg,#1a0000 0%,#7f1d1d 40%,#9f1239 70%,#450a0a 100%);
      border:2px solid rgba(239,68,68,.5);
      position:relative;overflow:hidden;
      animation:imp-border 1.6s ease-in-out infinite;
    }
    /* Дешевша «червона тривога»: анімуємо лише box-shadow по краю, без overlay-шару */
    @keyframes imp-border{
      0%,100%{box-shadow:inset 0 0 0 0 rgba(239,68,68,0)}
      50%   {box-shadow:inset 0 0 30px 0 rgba(239,68,68,.35)}
    }

    /* ── зображення персонажа ── */
    .char-img-wrap{
      position:relative;width:100%;flex:1;display:flex;align-items:center;justify-content:center;
      min-height:150px;padding-top:16px;z-index:1;
    }
    .char-img-container{
      position:relative;
      width:130px;height:130px;
      flex-shrink:0;
    }
    /* Золота рамка для мирних */
    .char-frame-peace{
      position:absolute;inset:-4px;
      border-radius:50%;
      background:conic-gradient(
        #fbbf24 0deg, #f59e0b 60deg, #fde68a 120deg,
        #f59e0b 180deg, #fbbf24 240deg, #fde68a 300deg, #fbbf24 360deg
      );
      animation:spin-frame 6s linear infinite;
      z-index:0;
      will-change:transform; transform:translateZ(0); backface-visibility:hidden;
    }
    /* Червона рамка для імпостерів */
    .char-frame-imp{
      position:absolute;inset:-4px;
      border-radius:50%;
      background:conic-gradient(
        #ef4444 0deg, #dc2626 60deg, #fca5a5 120deg,
        #ef4444 180deg, #b91c1c 240deg, #fca5a5 300deg, #ef4444 360deg
      );
      animation:spin-frame 3s linear infinite;
      z-index:0;
      will-change:transform; transform:translateZ(0); backface-visibility:hidden;
    }
    @keyframes spin-frame{from{transform:rotate(0)}to{transform:rotate(360deg)}}

    .char-img-bg{
      position:absolute;inset:3px;
      border-radius:50%;
      z-index:1;
    }
    .char-img-bg-peace{ background:linear-gradient(135deg,#1e1b4b,#2d1b69); }
    .char-img-bg-imp{ background:linear-gradient(135deg,#1a0000,#450a0a); }

    .char-img{
      position:absolute;inset:3px;
      border-radius:50%;overflow:hidden;
      z-index:2;
      display:flex;align-items:center;justify-content:center;
    }
    .char-img img{
      width:120%;height:120%;
      object-fit:cover;
      object-position:center top;
      display:block;
      transform:scale(1.05) translateY(-3%);
      transition:opacity .3s;
    }
    .char-img img.loading{ opacity:0; }
    .char-img img.loaded{ opacity:1; }
    .char-fallback{
      font-size:56px;line-height:1;
      display:flex;align-items:center;justify-content:center;
      width:100%;height:100%;
    }

    /* Зовнішнє мерехтіння навколо рамки */
    .char-glow-peace{
      position:absolute;inset:-12px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(251,191,36,.35) 0%,transparent 70%);
      z-index:-1;
      animation:glow-pulse 2s ease-in-out infinite;
      will-change:transform,opacity; transform:translateZ(0);
    }
    .char-glow-imp{
      position:absolute;inset:-12px;
      border-radius:50%;
      background:radial-gradient(circle,rgba(239,68,68,.3) 0%,transparent 70%);
      z-index:-1;
      animation:glow-pulse 1.3s ease-in-out infinite;
      will-change:transform,opacity; transform:translateZ(0);
    }
    @keyframes glow-pulse{0%,100%{opacity:.5;transform:scale(1)}50%{opacity:1;transform:scale(1.08)}}

    /* зірочки навколо для мирних */
    .char-stars{
      position:absolute;inset:-20px;
      border-radius:50%;
      pointer-events:none;
      z-index:0;
    }
    .char-star{
      position:absolute;
      width:5px;height:5px;
      border-radius:50%;
      background:var(--yellow);
      box-shadow:0 0 6px var(--yellow);
    }

    /* ── нижня частина карти ── */
    .card-bottom{
      width:100%;
      padding:14px 18px 18px;
      background:linear-gradient(to top, rgba(0,0,0,.6) 0%, transparent 100%);
      display:flex;flex-direction:column;align-items:center;gap:8px;
      z-index:2;position:relative;
    }
    .role-name{font-family:var(--ftitle);font-size:26px;letter-spacing:1px;color:#fff;
               text-shadow:0 2px 12px rgba(0,0,0,.8);}
    .role-loc{
      display:flex;align-items:center;gap:6px;
      background:rgba(0,0,0,.55);
      border:1px solid rgba(255,255,255,.15);
      border-radius:12px;padding:5px 14px;
      font-size:13px;font-weight:800;color:#cffafe;
    }
    .role-badge{
      background:rgba(16,185,129,.3);border:1px solid rgba(52,211,153,.5);
      border-radius:10px;padding:4px 14px;
      font-size:11px;font-weight:900;color:#6ee7b7;
      letter-spacing:2px;text-transform:uppercase;
    }
    .imp-title{
      font-family:var(--ftitle);font-size:32px;letter-spacing:2px;
      color:#fca5a5;text-transform:uppercase;
      animation:shake 1.1s ease-in-out infinite;position:relative;z-index:1;
      text-shadow:0 0 20px rgba(239,68,68,.6);
    }
    @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
    .imp-sub{font-size:13px;color:rgba(252,165,165,.8);font-weight:700;position:relative;z-index:1;}
    .imp-badge{
      background:rgba(239,68,68,.35);border:1px solid rgba(248,113,113,.5);
      border-radius:10px;padding:4px 14px;
      font-size:11px;font-weight:900;color:#fca5a5;
      letter-spacing:2px;text-transform:uppercase;position:relative;z-index:1;
    }

    /* ── COVER ── */
    .cover{position:absolute;inset:0;z-index:2;
           border-radius:28px;
           background:linear-gradient(135deg,#3730a3,#581c87);
           border:2px solid rgba(167,139,250,.4);
           box-shadow:0 16px 50px rgba(0,0,0,.55);
           display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:10px;padding:28px;
           transform:translateY(0);
           will-change:transform;cursor:grab;}
    .cover-eye{font-size:52px;animation:blink 3s ease-in-out infinite;}
    @keyframes blink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}}
    .cover-title{font-family:var(--ftitle);font-size:22px;letter-spacing:1px;
                 color:#fff;text-align:center;}
    .cover-hint{font-size:12px;color:rgba(196,181,253,.75);font-weight:700;}
    .swipe-arr{font-size:22px;animation:bounce-up .9s ease-in-out infinite;}
    @keyframes bounce-up{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

    .particles{position:absolute;inset:0;pointer-events:none;
               border-radius:28px;overflow:hidden;z-index:3;
               contain:strict;}
    .particle{position:absolute;width:8px;height:8px;border-radius:50%;top:50%;left:50%;
              will-change:transform,opacity;}
    .particle.pop{animation:pop var(--dur,.7s) ease-out var(--dl,0s) forwards;}
    @keyframes pop{
      0%{transform:translate(-50%,-50%) scale(0);opacity:1;}
      60%{opacity:1;}
      100%{transform:translate(calc(-50% + var(--tx,0px)),calc(-50% + var(--ty,0px))) scale(0);opacity:0;}
    }

    .btn-next{width:100%;height:56px;border-radius:18px;border:none;cursor:pointer;
              background:linear-gradient(90deg,#10b981,#0d9488);color:#fff;
              font-family:var(--ftitle);font-size:22px;letter-spacing:1px;
              box-shadow:0 4px 20px rgba(16,185,129,.4);
              transition:transform .12s,opacity .3s;
              opacity:0;pointer-events:none;}
    .btn-next.on{opacity:1;pointer-events:auto;}
    .btn-next:active{transform:scale(.96);}
    .btn-ghost{background:none;border:none;color:rgba(196,181,253,.4);
               font-size:13px;font-weight:800;cursor:pointer;padding:6px;}
    .btn-ghost:active{opacity:.5;}

    /* ── DONE ── */
    .done-emoji{font-size:88px;display:block;text-align:center;
                animation:spin-in .9s cubic-bezier(.34,1.56,.64,1) both;}
    @keyframes spin-in{from{transform:rotate(-180deg) scale(0);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
    .done-title{font-family:var(--ftitle);font-size:40px;letter-spacing:2px;
                color:var(--yellow);text-align:center;
                text-shadow:0 2px 20px rgba(250,204,21,.5);}
    .done-sub{color:#c4b5fd;font-size:15px;font-weight:700;text-align:center;margin-top:6px;}

    /* ── RESULTS ── */
    .results-header{text-align:center;}
    .results-title{font-family:var(--ftitle);font-size:36px;letter-spacing:2px;color:var(--yellow);
                   text-shadow:0 2px 20px rgba(250,204,21,.5);}
    .results-sub{font-size:12px;color:#a78bfa;font-weight:800;letter-spacing:3px;text-transform:uppercase;margin-top:4px;}

    .results-scroll{width:100%;max-height:52vh;overflow-y:auto;display:flex;flex-direction:column;gap:8px;
                    padding-right:2px;}
    .results-scroll::-webkit-scrollbar{width:3px;}
    .results-scroll::-webkit-scrollbar-track{background:transparent;}
    .results-scroll::-webkit-scrollbar-thumb{background:rgba(167,139,250,.4);border-radius:99px;}

    .result-row{display:flex;align-items:center;gap:12px;
                background:rgba(255,255,255,.08);border-radius:16px;
                padding:10px 14px;border:1px solid rgba(255,255,255,.12);
                animation:slide-in .35s cubic-bezier(.16,1,.3,1) both;
                animation-delay:var(--rd,0s);}
    @keyframes slide-in{from{transform:translateX(-20px);opacity:0}to{transform:translateX(0);opacity:1}}
    .result-row.is-imp{background:rgba(239,68,68,.15);border-color:rgba(248,113,113,.35);}
    .result-num{font-family:var(--ftitle);font-size:22px;color:rgba(255,255,255,.35);min-width:28px;}

    /* ── thumbnail у результатах ── */
    .result-thumb{
      width:44px;height:44px;border-radius:50%;overflow:hidden;
      flex-shrink:0;border:2px solid rgba(255,255,255,.2);
      background:rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;position:relative;
    }
    .result-thumb.imp-thumb{border-color:rgba(239,68,68,.5);background:rgba(239,68,68,.15);}
    .result-thumb img{width:130%;height:130%;object-fit:cover;object-position:center top;transform:translateY(-5%);}
    .result-info{flex:1;}
    .result-brawler{font-weight:900;font-size:14px;color:#fff;}
    .result-loc{font-size:11px;color:#a78bfa;font-weight:700;margin-top:1px;}
    .result-pill{padding:3px 10px;border-radius:8px;font-size:10px;font-weight:900;
                 letter-spacing:1.5px;text-transform:uppercase;white-space:nowrap;}
    .pill-peace{background:rgba(16,185,129,.25);color:#6ee7b7;border:1px solid rgba(52,211,153,.3);}
    .pill-imp{background:rgba(239,68,68,.3);color:#fca5a5;border:1px solid rgba(248,113,113,.35);}

    .results-info-card{width:100%;background:rgba(255,255,255,.07);border-radius:18px;
                       border:1px solid rgba(255,255,255,.14);padding:14px 18px;
                       display:flex;align-items:center;gap:14px;}
    .ric-thumb{
      width:56px;height:56px;border-radius:50%;overflow:hidden;flex-shrink:0;
      border:2px solid rgba(251,191,36,.5);
      background:rgba(255,255,255,.08);
      display:flex;align-items:center;justify-content:center;font-size:28px;
    }
    .ric-thumb img{width:130%;height:130%;object-fit:cover;object-position:center top;transform:translateY(-5%);}
    .ric-text{font-size:12px;color:#c4b5fd;font-weight:700;line-height:1.5;}
    .ric-brawler{font-family:var(--ftitle);font-size:20px;color:#fff;letter-spacing:1px;}
    .ric-loc{color:var(--cyan);font-weight:800;}

    .btn-row{display:flex;gap:10px;width:100%;}
    .btn-half{flex:1;height:52px;border-radius:16px;border:none;cursor:pointer;
              font-family:var(--ftitle);font-size:18px;letter-spacing:1px;
              transition:transform .12s;}
    .btn-half:active{transform:scale(.95);}
    .btn-half.primary{background:linear-gradient(90deg,var(--yellow),var(--orange));color:#1a0533;
                      box-shadow:0 4px 20px rgba(250,204,21,.35);}
    .btn-half.secondary{background:rgba(255,255,255,.12);color:#fff;
                        border:1px solid rgba(255,255,255,.2);}
  </style>
</head>
<body>

<div class="stars" id="stars"></div>

<div id="app">

  <!-- SETTINGS -->
  <div class="screen" id="screen-settings">
    <div>
      <span class="title-emoji">🕵️</span>
      <h1>ХТО ІМПОСТЕР?</h1>
      <p class="subtitle" id="mode-subtitle">Brawl Stars Edition</p>
    </div>

    <div class="picker-wrap">
      <button class="picker-btn active" id="pick-bs" onclick="selectMode('bs')">
        <span class="picker-icon">⭐</span>
        <span class="picker-label">BRAWL STARS</span>
      </button>
      <button class="picker-btn" id="pick-cr" onclick="selectMode('cr')">
        <span class="picker-icon">👑</span>
        <span class="picker-label">CLASH ROYALE</span>
      </button>
    </div>

    <div class="card">
      <div class="sec-label">👥 Кількість гравців</div>
      <div class="stepper">
        <button class="step-btn" id="pl-minus">−</button>
        <div class="step-val y" id="pl-val">5</div>
        <button class="step-btn" id="pl-plus">+</button>
      </div>
      <p class="step-hint">від 3 до 20</p>
      <div class="divider"></div>
      <div class="sec-label">💀 Кількість імпостерів</div>
      <div class="stepper">
        <button class="step-btn" id="im-minus">−</button>
        <div class="step-val r" id="im-val">1</div>
        <button class="step-btn" id="im-plus">+</button>
      </div>
      <p class="step-hint" id="im-hint">від 1 до 2</p>
    </div>
    <button class="btn-primary" id="btn-start">⚡ РОЗПОЧАТИ ГРУ</button>
  </div>

  <!-- GAME -->
  <div class="screen hidden" id="screen-game">
    <div class="progress-wrap">
      <div class="progress-top">
        <span>Прогрес</span><span id="prog-txt">1 / 5</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="prog-bar" style="width:20%"></div>
      </div>
    </div>

    <p class="player-tag" id="player-tag">ГРАВЕЦЬ 1</p>

    <div class="card-wrap" id="card-wrap">
      <div class="role-card role-peace" id="role-card"></div>
      <div class="cover" id="cover">
        <div class="cover-eye">👁️</div>
        <div class="cover-title" id="cover-title">Гравець 1, свайп вгору</div>
        <div class="cover-hint">щоб побачити свою роль</div>

// CDN HELPER

// Brawl Stars: brawlify.com CDN — формат назви без пробілів
// https://cdn.brawlify.com/brawler-bs/{Name}.png  (великі букви, без пробілів)
function bsImgUrl(name) {
  // Нормалізуємо: видаляємо крапки, коми, апострофи; замінюємо пробіли на '-'
  const slug = name
    .replace(/['.]/g, '')
    .replace(/\s+/g, '-')
    .replace(/ь/g, '')   // транслітерація не потрібна — назви вже EN у slug
    ;
  // Для EN назв — використовуємо їх безпосередньо
  return null; // буде перевизначено нижче через окреме поле
}

// Clash Royale: RoyaleAPI assets
// https://royaleapi.github.io/cr-api-assets/cards-150/{slug}.png
function crImgUrl(slug) {
  return `https://royaleapi.github.io/cr-api-assets/cards-150/${slug}.png`;
}

let audioCtx = null;
function getCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
function playTone(freq, type, duration, volume=0.18, delay=0) {
  try {
    const ctx = getCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime + delay);
    gain.gain.setValueAtTime(0, ctx.currentTime + delay);
    gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + delay + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + delay + duration);
    osc.start(ctx.currentTime + delay);
    osc.stop(ctx.currentTime + delay + duration + 0.05);
  } catch(e) {}
}

const SFX = {
  click()   { playTone(800,'square',0.06,0.12); },
  start()   { [261,329,392,523].forEach((f,i)=>playTone(f,'sine',0.25,0.15,i*.07)); },
  reveal()  { playTone(300,'sine',0.08,.1); playTone(600,'sine',0.15,.12,.06); playTone(900,'sine',0.1,.08,.12); },
  peace()   { [523,659,784].forEach((f,i)=>playTone(f,'sine',0.3,.13,i*.08)); },
  next()    { playTone(440,'sine',0.1,.12); playTone(550,'sine',0.1,.1,.08); },
  done()    { [523,659,784,1047].forEach((f,i)=>playTone(f,'sine',0.3,.18,i*.1)); playTone(523,'sine',0.5,.15,.45); },
  pop()     { for(let i=0;i<5;i++) playTone(400+Math.random()*400,'sine',0.08,.07,i*.04); }
};

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }

// ГЕНЕРАЦІЯ РОЛЕЙ

function generateRoles(playerCount, impostorCount) {
  const chars    = gameMode === 'cr' ? CR_CHARS : BRAWLERS;
  const locs     = gameMode === 'cr' ? CR_LOCATIONS : BS_LOCATIONS;
  const brawler  = pick(chars);
  const location = pick(locs);
  const indices  = Array.from({length: playerCount}, (_, i) => i);
  const impSet   = new Set(shuffle(indices).slice(0, impostorCount));
  return Array.from({length: playerCount}, (_, i) => ({
    brawler, location, isImpostor: impSet.has(i)
  }));
}

  document.getElementById('pl-val').textContent = players;
  impostors = Math.min(impostors, maxImp());
  document.getElementById('im-val').textContent = impostors;
  document.getElementById('im-hint').textContent = `від 1 до ${maxImp()}`;

const PARTICLE_COLORS = ['#facc15','#f97316','#a855f7','#22d3ee','#f43f5e','#4ade80'];
function popParticles() {
  const c = document.getElementById('particles');
  c.innerHTML = '';
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div'); p.className = 'particle pop';
    const tx = (Math.random()-.5)*280, ty = (Math.random()-.5)*280;
    p.style.cssText = `background:${PARTICLE_COLORS[i%PARTICLE_COLORS.length]};--tx:${tx}px;--ty:${ty}px;--dur:${.55+Math.random()*.35}s;--dl:${i*.018}s`;
    frag.appendChild(p);
  }
  c.appendChild(frag);
  SFX.pop();
}

function makeCharImgHTML(char, frameClass, bgClass, glowClass) {
  const escapedEmoji = char.emoji;
  // Якщо картинку вже префетчили — рендеримо одразу як loaded (без opacity-fade), щоб не було «миготіння».
  const cached = imgCache.has(char.img);
  return `
    <div class="char-img-container">
      <div class="${frameClass}"></div>
      <div class="char-img-bg ${bgClass}"></div>
      <div class="char-img">
        <img
          src="${char.img}"
          alt="${char.name}"
          decoding="async"
          loading="eager"
          fetchpriority="high"
          class="${cached ? 'loaded' : 'loading'}"
          onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
          onload="this.classList.remove('loading');this.classList.add('loaded');"
        />
        <div class="char-fallback" style="display:none">${escapedEmoji}</div>
      </div>
      <div class="${glowClass}"></div>
    </div>`;
}

// Кеш префетчених картинок (URL -> HTMLImageElement). Тримаємо посилання, щоб браузер не вивантажив із памʼяті.
const imgCache = new Map();
function prefetchImage(url) {
  if (!url || imgCache.has(url)) return Promise.resolve();
  return new Promise((resolve) => {
    const img = new Image();
    img.decoding = 'async';
    img.onload = img.onerror = () => { imgCache.set(url, img); resolve(); };
    img.src = url;
  });
}

// ═══════════════════════════════════════════════════════════════════════════
// ВІДКРИТТЯ КАРТИ — фізична симуляція (rAF + гравітація + відскок)
// ═══════════════════════════════════════════════════════════════════════════
//
// Замість простого CSS-переходу translateY(-110%) робимо повноцінний політ:
//   • кидок угору з тією швидкістю, що зафіксована під час свайпу;
//   • кожен кадр додаємо g*dt до vy → парабола;
//   • досягаємо вершини, падаємо назад вниз;
//   • при поверненні до вихідної точки робимо короткий відскок із демпфуванням.
//
// Підбір констант: g=1500 px/с², початкова швидкість у діапазоні
// [-2400, -1300] px/с — політ триває ~2-2.5с, апекс ~600-1000px (далеко поза картою).

const PHYS = { gravity: 1500, vMin: -1300, vMax: -2400, bounceDamp: 0.28, bounceMin: 200 };
let physicsRAF = null;

function cancelPhysics() {
  if (physicsRAF) { cancelAnimationFrame(physicsRAF); physicsRAF = null; }
}

function physicsLaunch(startY, initialVy) {
  if (revealed) return;
  revealed = true;
  SFX.reveal();
  const cover = document.getElementById('cover');
  cover.style.transition = 'none';

  let y  = startY;
  let vy = initialVy; // px/с, від'ємне = вгору
  let last = performance.now();
  let didPop = false;
  let bouncesLeft = 1;
  const apexTrigger = -Math.max(120, cover.offsetHeight * 0.45);

  function step(now) {
    const dt = Math.min((now - last) / 1000, 0.033); // обрізаємо dt при лагах
    last = now;

    vy += PHYS.gravity * dt;
    y  += vy * dt;

    // Коли карта достатньо «розкрилась» — частинки + звук, один раз
    if (!didPop && y < apexTrigger) {
      didPop = true;
      popParticles();
      SFX.peace();
    }

    // Контакт з низом — відскок або зупинка
    if (y >= 0) {
      y = 0;
      if (vy > PHYS.bounceMin && bouncesLeft > 0) {
        vy = -vy * PHYS.bounceDamp;
        bouncesLeft--;
        cover.style.transform = `translate3d(0,${y}px,0)`;
        physicsRAF = requestAnimationFrame(step);
        return;
      }
      cover.style.transform = 'translate3d(0,0,0)';
      physicsRAF = null;
      // Невелика затримка, щоб око встигло «приземлити» картку перед появою кнопки
      setTimeout(() => document.getElementById('btn-next').classList.add('on'), 120);
      return;
    }

    cover.style.transform = `translate3d(0,${y}px,0)`;
    physicsRAF = requestAnimationFrame(step);
  }

  physicsRAF = requestAnimationFrame(step);
}

// ═══════════════════════════════════════════════════════════════════════════
// СВАЙП — з відстеженням швидкості пальця
// ═══════════════════════════════════════════════════════════════════════════

(function() {
  const wrap = document.getElementById('card-wrap');
  let sy=0, sx=0, drag=false, delta=0;
  let lastY=0, lastT=0, vy=0;     // для оцінки швидкості пальця
  const THRESHOLD = 55;           // мінімальна відстань, щоб зарахувати свайп
  const VEL_TRIGGER = -350;       // або достатньо швидкий «кидок» вгору (px/с)

  function start(y,x) {
    if (revealed) return;
    cancelPhysics();
    sy = y; sx = x; drag = true; delta = 0;
    lastY = y; lastT = performance.now(); vy = 0;
    document.getElementById('cover').style.transition = 'none';
  }
  function move(y,x) {
    if (!drag || revealed) return;
    const dy = y - sy, dx = x - sx;
    if (Math.abs(dx) > Math.abs(dy) + 12) { drag = false; return; }
    delta = Math.min(0, dy);
    document.getElementById('cover').style.transform = `translate3d(0,${delta}px,0)`;
    // Оцінка швидкості — ковзне середнє по двох останніх семплах
    const now = performance.now();
    const dt  = now - lastT;
    if (dt > 0) {
      const inst = (y - lastY) / dt * 1000; // px/с
      vy = vy * 0.4 + inst * 0.6;           // згладжування
    }
    lastY = y; lastT = now;
  }
  function end() {
    if (!drag) return;
    drag = false;
    const passedDist = Math.abs(delta) >= THRESHOLD;
    const fastFlick  = vy < VEL_TRIGGER;

    if (passedDist || fastFlick) {
      // Підбираємо стартову швидкість для фізики:
      //   • беремо реальну швидкість пальця, якщо вона достатньо велика;
      //   • інакше — мінімальний «кидок», щоб політ був видовищним;
      //   • зверху обмежуємо, щоб картка не зникала миттєво.
      let launchVy = Math.min(vy, PHYS.vMin);     // не повільніше, ніж vMin
      launchVy     = Math.max(launchVy, PHYS.vMax); // не швидше, ніж vMax
      physicsLaunch(delta, launchVy);
    } else {
      // Не докинув — пружне повернення
      const c = document.getElementById('cover');
      c.style.transition = 'transform .35s cubic-bezier(.16,1,.3,1)';
      c.style.transform  = 'translate3d(0,0,0)';
    }
    delta = 0; vy = 0;
  }

  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];start(t.clientY,t.clientX);},{passive:true});
  wrap.addEventListener('touchmove', e=>{const t=e.touches[0];move(t.clientY,t.clientX);},{passive:true});
  wrap.addEventListener('touchend',  end);
  wrap.addEventListener('touchcancel', end);
  wrap.addEventListener('mousedown', e=>start(e.clientY,e.clientX));
  window.addEventListener('mousemove',e=>{if(drag)move(e.clientY,e.clientX);});
  window.addEventListener('mouseup', end);
})();

function makeThumbHTML(char, isImp) {
  if (isImp) {
    return `<div class="result-thumb imp-thumb">💀</div>`;

  return `
    <div class="result-thumb">
      <img src="${char.img}" alt="${char.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
           onload="this.style.opacity='1';" style="opacity:0;transition:opacity .3s">
      <span style="display:none;font-size:22px">${char.emoji}</span>
    </div>`;
}

function showResults() {
  const {brawler, location} = roles[0];
  const charLabel = gameMode === 'cr' ? 'Персонаж' : 'Бравлер';
  const impostorNums = roles
    .map((r,i) => r.isImpostor ? `Гравець ${i+1}` : null)
    .filter(Boolean);

  const infoCard = document.getElementById('results-info-card');
  infoCard.innerHTML = `
    <div class="ric-thumb">
      <img src="${brawler.img}" alt="${brawler.name}"
           onerror="this.style.display='none';this.nextElementSibling.style.display='block';"
           onload="this.style.opacity='1';" style="opacity:0;transition:opacity .3s">
      <span style="display:none;font-size:28px">${brawler.emoji}</span>
    </div>
    <div class="ric-text">
      <div style="font-size:10px;color:#a78bfa;font-weight:800;letter-spacing:2px;text-transform:uppercase">${charLabel}</div>
      <div class="ric-brawler">${brawler.name}</div>
      <div class="ric-loc">📍 ${location}</div>
      <div style="margin-top:4px;font-size:11px;color:#6ee7b7">
        Імпостер${impostorNums.length>1?'и':''}: <strong>${impostorNums.join(', ')}</strong>
      </div>
    </div>`;

  const list = document.getElementById('results-list');
  list.innerHTML = '';
  roles.forEach((r,i) => {
    const row = document.createElement('div');
    row.className = 'result-row' + (r.isImpostor ? ' is-imp' : '');
    row.style.setProperty('--rd', `${i * 0.06}s`);
    row.innerHTML = `
      <div class="result-num">${i+1}</div>
      ${makeThumbHTML(r.brawler, r.isImpostor)}
      <div class="result-info">
        <div class="result-brawler">${r.isImpostor ? 'ІМПОСТЕР' : r.brawler.name}</div>
        <div class="result-loc">${r.isImpostor ? 'Не знав локацію' : '📍 '+r.location}</div>
      </div>
      <div class="result-pill ${r.isImpostor ? 'pill-imp' : 'pill-peace'}">
        ${r.isImpostor ? '☠️ ІМП' : '✅ МИР'}
      </div>`;
    list.appendChild(row);
  });

  showScreen('results');
}

// ═══════════════════════════════════════════════════════════════════════════

document.getElementById('btn-next').onclick = () => {
  SFX.next(); current++;
  if (current >= roles.length) { SFX.done(); showScreen('done'); }
  else { renderCard(current); }
};

  SFX.start();
  roles = generateRoles(players, impostors);
  current = 0;
  // Префетч картинки персонажа, щоб перший reveal був без затримки.
  prefetchImage(roles[0].brawler.img);
  showScreen('game');
  renderCard(0);
};
document.getElementById('btn-cancel').onclick    = () => { SFX.click(); showScreen('settings'); };
document.getElementById('btn-restart').onclick   = () => { SFX.click(); showScreen('settings'); };
document.getElementById('btn-show-results').onclick = () => { SFX.click(); showResults(); };
document.getElementById('btn-results-new').onclick  = () => { SFX.click(); showScreen('settings'); };
document.getElementById('btn-results-same').onclick = () => {
  SFX.start();
  roles = generateRoles(players, impostors);
  current = 0;
  prefetchImage(roles[0].brawler.img);
  showScreen('game');
  renderCard(0);
};
