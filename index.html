<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Хто Імпостер? — Brawl Stars</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@700;800;900&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }

    :root {
      --yellow:#facc15; --orange:#f97316; --red:#ef4444;
      --cyan:#22d3ee;   --bg1:#1a0533;   --bg2:#0d1b4a; --bg3:#0f2560;
      --ftitle:'Bebas Neue','Arial Black',Arial,sans-serif;
      --fbody:'Nunito','Helvetica Neue',Arial,sans-serif;
    }

    html,body {
      height:100%; font-family:var(--fbody);
      background:linear-gradient(145deg,var(--bg1) 0%,var(--bg2) 50%,var(--bg3) 100%);
      color:#fff; overflow:hidden; -webkit-font-smoothing:antialiased;
    }

    /* BG */
    .blob { position:fixed; border-radius:50%; pointer-events:none; filter:blur(80px); z-index:0; }
    .blob-tl { width:300px;height:300px;background:rgba(168,85,247,.2); top:-100px;left:-100px; }
    .blob-br { width:350px;height:350px;background:rgba(59,130,246,.2);  bottom:-120px;right:-120px; }
    .stars { position:fixed;inset:0;pointer-events:none;z-index:0; }
    .star  { position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;
             animation:twinkle var(--d,3s) infinite ease-in-out var(--dl,0s); }
    @keyframes twinkle{0%,100%{opacity:.08}50%{opacity:.55}}

    /* APP */
    #app {
      position:relative;z-index:1;height:100dvh;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:20px 16px;overflow:hidden;
    }

    /* SCREENS */
    .screen{width:100%;max-width:400px;display:flex;flex-direction:column;align-items:center;gap:22px;}
    .screen.hidden{display:none;}

    /* ── SETTINGS ── */
    .title-emoji{font-size:58px;display:block;text-align:center;animation:wobble 3s ease-in-out infinite;}
    @keyframes wobble{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(8deg)}}
    h1{font-family:var(--ftitle);font-size:40px;letter-spacing:3px;color:var(--yellow);
       text-align:center;text-shadow:0 2px 24px rgba(250,204,21,.55);line-height:1;}
    .subtitle{color:#c4b5fd;font-size:11px;font-weight:800;letter-spacing:5px;
              text-transform:uppercase;text-align:center;}
    .card{width:100%;background:rgba(255,255,255,.1);backdrop-filter:blur(16px);
          border:1px solid rgba(255,255,255,.2);border-radius:24px;
          padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.4);}
    .divider{height:1px;background:rgba(255,255,255,.15);margin:18px 0;}
    .sec-label{display:flex;align-items:center;gap:8px;
               font-size:15px;font-weight:900;margin-bottom:12px;}
    .stepper{display:flex;align-items:center;gap:10px;}
    .step-btn{width:48px;height:48px;border-radius:14px;flex-shrink:0;
              background:rgba(255,255,255,.17);border:1px solid rgba(255,255,255,.28);
              color:#fff;font-size:28px;font-weight:900;cursor:pointer;
              display:flex;align-items:center;justify-content:center;
              transition:transform .1s,background .1s;}
    .step-btn:active{transform:scale(.85);background:rgba(255,255,255,.3);}
    .step-val{flex:1;text-align:center;font-family:var(--ftitle);font-size:52px;line-height:1;}
    .step-val.y{color:var(--yellow);}
    .step-val.r{color:#f87171;}
    .step-hint{text-align:center;font-size:11px;color:#a78bfa;font-weight:700;margin-top:4px;}
    .btn-primary{width:100%;height:58px;border-radius:18px;border:none;cursor:pointer;
                 background:linear-gradient(90deg,var(--yellow),var(--orange));
                 color:#1a0533;font-family:var(--ftitle);font-size:22px;letter-spacing:2px;
                 box-shadow:0 4px 28px rgba(250,204,21,.45);transition:transform .12s;}
    .btn-primary:active{transform:scale(.96);}

    /* ── GAME ── */
    .progress-wrap{width:100%;}
    .progress-top{display:flex;justify-content:space-between;
                  font-size:11px;color:#a78bfa;font-weight:800;margin-bottom:5px;}
    .progress-track{height:7px;background:rgba(255,255,255,.1);border-radius:99px;overflow:hidden;}
    .progress-bar{height:100%;background:linear-gradient(90deg,var(--yellow),var(--orange));
                  border-radius:99px;transition:width .4s ease;}
    .player-tag{font-family:var(--ftitle);font-size:20px;letter-spacing:3px;
                color:rgba(255,255,255,.55);text-align:center;}

    /* CARD WRAP */
    .card-wrap{width:100%;position:relative;border-radius:28px;overflow:hidden;
               touch-action:pan-x;user-select:none;-webkit-user-select:none;}

    /* ROLE CARD (behind) */
    .role-card{width:100%;min-height:230px;border-radius:28px;
               display:flex;flex-direction:column;align-items:center;
               justify-content:center;gap:10px;padding:24px;text-align:center;}
    .role-peace{background:linear-gradient(135deg,#1d4ed8,#4338ca,#6d28d9);
                border:2px solid rgba(34,211,238,.45);}
    .role-impostor{background:linear-gradient(135deg,#7f1d1d,#9f1239,#450a0a);
                   border:2px solid rgba(239,68,68,.5);position:relative;overflow:hidden;}
    .role-impostor::after{content:'';position:absolute;inset:0;border-radius:26px;
                          background:rgba(239,68,68,.07);
                          animation:pulse-red 1.6s infinite;pointer-events:none;}
    @keyframes pulse-red{0%,100%{opacity:0}50%{opacity:1}}

    .role-emoji{font-size:62px;line-height:1;}
    .role-name{font-family:var(--ftitle);font-size:30px;letter-spacing:1px;color:#fff;}
    .role-loc{display:flex;align-items:center;gap:6px;
              background:rgba(255,255,255,.15);border-radius:12px;
              padding:6px 14px;font-size:13px;font-weight:800;color:#cffafe;}
    .role-badge{background:rgba(16,185,129,.25);border:1px solid rgba(52,211,153,.4);
                border-radius:12px;padding:4px 14px;
                font-size:11px;font-weight:900;color:#6ee7b7;
                letter-spacing:2px;text-transform:uppercase;}
    .imp-title{font-family:var(--ftitle);font-size:34px;letter-spacing:2px;
               color:#fca5a5;text-transform:uppercase;
               animation:shake 1.1s ease-in-out infinite;position:relative;z-index:1;}
    @keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
    .imp-sub{font-size:13px;color:rgba(252,165,165,.75);font-weight:700;position:relative;z-index:1;}
    .imp-badge{background:rgba(239,68,68,.3);border:1px solid rgba(248,113,113,.4);
               border-radius:12px;padding:4px 14px;
               font-size:11px;font-weight:900;color:#fca5a5;
               letter-spacing:2px;text-transform:uppercase;position:relative;z-index:1;}

    /* COVER (slides up) */
    .cover{position:absolute;inset:0;z-index:2;
           border-radius:28px;
           background:linear-gradient(135deg,#3730a3,#581c87);
           border:2px solid rgba(167,139,250,.4);
           box-shadow:0 16px 50px rgba(0,0,0,.55);
           display:flex;flex-direction:column;align-items:center;
           justify-content:center;gap:10px;padding:28px;
           transform:translateY(0);
           will-change:transform;cursor:grab;}
    .cover-eye{font-size:52px;animation:blink 3s ease-in-out infinite;}
    @keyframes blink{0%,88%,100%{transform:scaleY(1)}92%{transform:scaleY(.08)}}
    .cover-title{font-family:var(--ftitle);font-size:22px;letter-spacing:1px;
                 color:#fff;text-align:center;}
    .cover-hint{font-size:12px;color:rgba(196,181,253,.75);font-weight:700;}
    .swipe-arr{font-size:22px;animation:bounce-up .9s ease-in-out infinite;}
    @keyframes bounce-up{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}

    /* PARTICLES */
    .particles{position:absolute;inset:0;pointer-events:none;
               border-radius:28px;overflow:hidden;z-index:3;}
    .particle{position:absolute;width:8px;height:8px;border-radius:50%;top:50%;left:50%;}
    .particle.pop{animation:pop var(--dur,.7s) ease-out var(--dl,0s) forwards;}
    @keyframes pop{
      0%{transform:translate(-50%,-50%) scale(0);opacity:1;}
      60%{opacity:1;}
      100%{transform:translate(calc(-50% + var(--tx,0px)),calc(-50% + var(--ty,0px))) scale(0);opacity:0;}
    }

    /* NEXT BUTTON */
    .btn-next{width:100%;height:56px;border-radius:18px;border:none;cursor:pointer;
              background:linear-gradient(90deg,#10b981,#0d9488);color:#fff;
              font-family:var(--ftitle);font-size:22px;letter-spacing:1px;
              box-shadow:0 4px 20px rgba(16,185,129,.4);
              transition:transform .12s,opacity .3s;
              opacity:0;pointer-events:none;}
    .btn-next.on{opacity:1;pointer-events:auto;}
    .btn-next:active{transform:scale(.96);}
    .btn-ghost{background:none;border:none;color:rgba(196,181,253,.4);
               font-size:13px;font-weight:800;cursor:pointer;padding:6px;}
    .btn-ghost:active{opacity:.5;}

    /* DONE */
    .done-emoji{font-size:88px;display:block;text-align:center;
                animation:spin-in .9s cubic-bezier(.34,1.56,.64,1) both;}
    @keyframes spin-in{from{transform:rotate(-180deg) scale(0);opacity:0}to{transform:rotate(0) scale(1);opacity:1}}
    .done-title{font-family:var(--ftitle);font-size:40px;letter-spacing:2px;
                color:var(--yellow);text-align:center;
                text-shadow:0 2px 20px rgba(250,204,21,.5);}
    .done-sub{color:#c4b5fd;font-size:15px;font-weight:700;text-align:center;margin-top:6px;}
  </style>
</head>
<body>

<div class="blob blob-tl"></div>
<div class="blob blob-br"></div>
<div class="stars" id="stars"></div>

<div id="app">

  <!-- SETTINGS -->
  <div class="screen" id="screen-settings">
    <div>
      <span class="title-emoji">🕵️</span>
      <h1>ХТО ІМПОСТЕР?</h1>
      <p class="subtitle">Brawl Stars Edition</p>
    </div>
    <div class="card">
      <div class="sec-label">👥 Кількість гравців</div>
      <div class="stepper">
        <button class="step-btn" id="pl-minus">−</button>
        <div class="step-val y" id="pl-val">5</div>
        <button class="step-btn" id="pl-plus">+</button>
      </div>
      <p class="step-hint">від 3 до 20</p>
      <div class="divider"></div>
      <div class="sec-label">💀 Кількість імпостерів</div>
      <div class="stepper">
        <button class="step-btn" id="im-minus">−</button>
        <div class="step-val r" id="im-val">1</div>
        <button class="step-btn" id="im-plus">+</button>
      </div>
      <p class="step-hint" id="im-hint">від 1 до 2</p>
    </div>
    <button class="btn-primary" id="btn-start">⚡ РОЗПОЧАТИ ГРУ</button>
  </div>

  <!-- GAME -->
  <div class="screen hidden" id="screen-game">
    <div class="progress-wrap">
      <div class="progress-top">
        <span>Прогрес</span><span id="prog-txt">1 / 5</span>
      </div>
      <div class="progress-track">
        <div class="progress-bar" id="prog-bar" style="width:20%"></div>
      </div>
    </div>

    <p class="player-tag" id="player-tag">ГРАВЕЦЬ 1</p>

    <div class="card-wrap" id="card-wrap">
      <div class="role-card role-peace" id="role-card"></div>
      <div class="cover" id="cover">
        <div class="cover-eye">👁️</div>
        <div class="cover-title" id="cover-title">Гравець 1, свайп вгору</div>
        <div class="cover-hint">щоб побачити свою роль</div>
        <div class="swipe-arr">⬆️</div>
      </div>
      <div class="particles" id="particles"></div>
    </div>

    <button class="btn-next" id="btn-next">➡️ Я ЗАПАМ'ЯТАВ — ДАЛІ</button>
    <button class="btn-ghost" id="btn-cancel">↩ Скасувати гру</button>
  </div>

  <!-- DONE -->
  <div class="screen hidden" id="screen-done">
    <span class="done-emoji">🎮</span>
    <div>
      <div class="done-title">ВСІХ ОЗНАЙОМЛЕНО!</div>
      <div class="done-sub">Обговоріть та знайдіть імпостера 🔍</div>
    </div>
    <button class="btn-primary" id="btn-restart">↩ НОВА ГРА</button>
  </div>

</div>

<script>
const BRAWLERS = [
  {name:"Шеллі",emoji:"🔫"},{name:"Кольт",emoji:"🤠"},{name:"Ніта",emoji:"🐻"},
  {name:"Булл",emoji:"🐂"},{name:"Джессі",emoji:"⚡"},{name:"Брок",emoji:"🚀"},
  {name:"Динамайк",emoji:"💣"},{name:"Бо",emoji:"🏹"},{name:"Ель Прімо",emoji:"🥊"},
  {name:"Барлі",emoji:"🍺"},{name:"Поко",emoji:"🎸"},{name:"Роза",emoji:"🌹"},
  {name:"Ріко",emoji:"🎳"},{name:"Дерріл",emoji:"🛢️"},{name:"Пенні",emoji:"🏴‍☠️"},
  {name:"Карл",emoji:"⛏️"},{name:"Пайпер",emoji:"☂️"},{name:"Пам",emoji:"🔧"},
  {name:"Френк",emoji:"🔨"},{name:"Бібі",emoji:"🏏"},{name:"Мортіс",emoji:"⚰️"},
  {name:"Тара",emoji:"🃏"},{name:"Джин",emoji:"🧞"},{name:"Спайк",emoji:"🌵"},
  {name:"Ворон",emoji:"🐦‍⬛"},{name:"Леон",emoji:"🐱"},
];
const LOCATIONS = [
  "Смарагдова печера","Арена Шоудаун","Шахта кристалів","Магазин Барлі",
  "Стародавнє місто","Острів піратів","Кактусова пустеля","Зачарований ліс",
  "Металевий завод","Зірковий стадіон","Підводна база","Вулканічна фортеця",
  "Хмарний замок","Підземелля монстрів",
];

function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
  return a;
}

// ── GENERATE ROLES ───────────────────────────────────────────────────────────
// Everyone gets the SAME brawler. Peaceful players also see the location.
// Impostors only see "Ти Імпостер".
function generateRoles(playerCount, impostorCount) {
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const brawler  = pick(BRAWLERS);
  const location = pick(LOCATIONS);
  const impSet   = new Set(shuffle(Array.from({length:playerCount},(_,i)=>i)).slice(0,impostorCount));
  return Array.from({length:playerCount}, (_,i) => ({brawler, location, isImpostor:impSet.has(i)}));
}

// ── STARS ────────────────────────────────────────────────────────────────────
const starsEl = document.getElementById('stars');
for(let i=0;i<30;i++){
  const s=document.createElement('div'); s.className='star';
  s.style.cssText=`top:${Math.random()*100}%;left:${Math.random()*100}%;--d:${2+Math.random()*4}s;--dl:${Math.random()*4}s`;
  starsEl.appendChild(s);
}

// ── STATE ────────────────────────────────────────────────────────────────────
let players=5, impostors=1, roles=[], current=0, revealed=false, autoTimer=null;

function maxImp(){ return Math.min(3,Math.floor(players/2)); }
function syncSettings(){
  document.getElementById('pl-val').textContent=players;
  impostors=Math.min(impostors,maxImp());
  document.getElementById('im-val').textContent=impostors;
  document.getElementById('im-hint').textContent=`від 1 до ${maxImp()}`;
}
document.getElementById('pl-minus').onclick=()=>{if(players>3){players--;syncSettings();}};
document.getElementById('pl-plus') .onclick=()=>{if(players<20){players++;syncSettings();}};
document.getElementById('im-minus').onclick=()=>{if(impostors>1){impostors--;syncSettings();}};
document.getElementById('im-plus') .onclick=()=>{if(impostors<maxImp()){impostors++;syncSettings();}};

function showScreen(n){
  ['settings','game','done'].forEach(s=>
    document.getElementById('screen-'+s).classList.toggle('hidden',s!==n));
}

// ── PARTICLES ────────────────────────────────────────────────────────────────
function popParticles(){
  const c=document.getElementById('particles'); c.innerHTML='';
  const colors=['#facc15','#f97316','#a855f7','#22d3ee','#f43f5e','#4ade80'];
  for(let i=0;i<22;i++){
    const p=document.createElement('div'); p.className='particle pop';
    const tx=(Math.random()-.5)*280, ty=(Math.random()-.5)*280;
    p.style.cssText=`background:${colors[i%colors.length]};--tx:${tx}px;--ty:${ty}px;--dur:${.55+Math.random()*.35}s;--dl:${i*.018}s`;
    c.appendChild(p);
  }
}

// ── RENDER ───────────────────────────────────────────────────────────────────
function renderRoleCard(idx){
  const {brawler,location,isImpostor}=roles[idx];
  const rc=document.getElementById('role-card');
  if(isImpostor){
    rc.className='role-card role-impostor';
    rc.innerHTML=`
      <div class="role-emoji" style="animation:shake 1.1s ease-in-out infinite">💀</div>
      <div class="imp-title">Ти Імпостер!</div>
      <div class="imp-sub">Не видай себе — обдури всіх!</div>
      <div class="imp-badge">☠️ ІМПОСТЕР</div>`;
  } else {
    rc.className='role-card role-peace';
    rc.innerHTML=`
      <div class="role-emoji">${brawler.emoji}</div>
      <div class="role-name">${brawler.name}</div>
      <div class="role-loc">📍 ${location}</div>
      <div class="role-badge">✅ МИРНИЙ</div>`;
  }
}

function renderCard(idx){
  revealed=false;
  if(autoTimer){ clearTimeout(autoTimer); autoTimer=null; }

  const total=roles.length;
  document.getElementById('prog-txt').textContent=`${idx+1} / ${total}`;
  document.getElementById('prog-bar').style.width=`${((idx+1)/total)*100}%`;
  document.getElementById('player-tag').textContent=`ГРАВЕЦЬ ${idx+1}`;
  document.getElementById('cover-title').textContent=`Гравець ${idx+1}, свайп вгору`;
  document.getElementById('btn-next').textContent=
    (idx+1===total)?'🎮 ГРА РОЗПОЧАТА!':'➡️ Я ЗАПАМ\'ЯТАВ — ДАЛІ';

  // Reset cover instantly (no animation)
  const cover=document.getElementById('cover');
  cover.style.transition='none';
  cover.style.transform='translateY(0)';

  document.getElementById('btn-next').classList.remove('on');
  renderRoleCard(idx);
}

// ── REVEAL & AUTO-CLOSE ───────────────────────────────────────────────────────
function doReveal(){
  if(revealed) return;
  revealed=true;
  const cover=document.getElementById('cover');
  cover.style.transition='transform 0.45s cubic-bezier(.16,1,.3,1)';
  cover.style.transform='translateY(-110%)';

  setTimeout(popParticles, 200);

  // Auto-close after 2.5 s
  autoTimer=setTimeout(()=>{
    cover.style.transition='transform 0.5s cubic-bezier(.16,1,.3,1)';
    cover.style.transform='translateY(0)';
    // Show "next" button once cover is back down
    setTimeout(()=>{
      document.getElementById('btn-next').classList.add('on');
    }, 520);
  }, 2500);
}

// ── SWIPE DETECTION ───────────────────────────────────────────────────────────
(function(){
  const wrap=document.getElementById('card-wrap');
  let sy=0,sx=0,drag=false,delta=0;
  const THRESHOLD=55;

  function start(y,x){ if(revealed)return; sy=y;sx=x;drag=true;delta=0;
    document.getElementById('cover').style.transition='none'; }
  function move(y,x){
    if(!drag||revealed)return;
    const dy=y-sy, dx=x-sx;
    if(Math.abs(dx)>Math.abs(dy)+12){drag=false;return;}
    delta=Math.min(0,dy);
    document.getElementById('cover').style.transform=`translateY(${delta}px)`;
  }
  function end(){
    if(!drag)return; drag=false;
    if(Math.abs(delta)>=THRESHOLD){ doReveal(); }
    else {
      const c=document.getElementById('cover');
      c.style.transition='transform 0.35s cubic-bezier(.16,1,.3,1)';
      c.style.transform='translateY(0)';
    }
    delta=0;
  }

  wrap.addEventListener('touchstart',e=>{const t=e.touches[0];start(t.clientY,t.clientX);},{passive:true});
  wrap.addEventListener('touchmove', e=>{const t=e.touches[0];move(t.clientY,t.clientX);},{passive:true});
  wrap.addEventListener('touchend',  end);
  wrap.addEventListener('mousedown', e=>start(e.clientY,e.clientX));
  window.addEventListener('mousemove',e=>{if(drag)move(e.clientY,e.clientX);});
  window.addEventListener('mouseup',  end);
})();

// ── BUTTONS ───────────────────────────────────────────────────────────────────
document.getElementById('btn-next').onclick=()=>{
  current++;
  current>=roles.length ? showScreen('done') : renderCard(current);
};
document.getElementById('btn-start').onclick=()=>{
  roles=generateRoles(players,impostors);
  current=0; showScreen('game'); renderCard(0);
};
document.getElementById('btn-cancel') .onclick=()=>showScreen('settings');
document.getElementById('btn-restart').onclick=()=>showScreen('settings');

syncSettings();
</script>
</body>
</html>
